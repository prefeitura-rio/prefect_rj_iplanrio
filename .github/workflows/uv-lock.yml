name: uv lock

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: uv-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  uv-lock-check:
    name: uv lock --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Check that uv.lock is up to date
        run: |
          if ! uv lock --check; then
            echo "::error file=uv.lock::uv.lock is out of date with the workspace pyproject.toml files. Run 'uv lock' and commit the updated uv.lock."
            exit 1
          fi
