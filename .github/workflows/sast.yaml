name: SAST
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run the SAST scan
        uses: prefeitura-rio/actions/sast@39454781d7508aa89278145b7b5affc37f63e0b7 # master
        with:
          sonar_url: ${{ vars.SONARQUBE_URL }}
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          dd_url: ${{ vars.DEFECTDOJO_URL }}
          dd_token: ${{ secrets.DEFECTDOJO_TOKEN }}
          ts_tags: tag:prefect-cicd
          ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}
