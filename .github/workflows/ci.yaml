name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv --profile checks shell -- bash -e {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
      - name: Restore the virtual environment
        id: venv-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'packages/toolkit/pyproject.toml', 'devenv.nix', 'devenv.lock', 'nix/**') }}
      - name: Run the checks
        run: devenv --profile checks tasks run lint:all test:all
      - name: Save the virtual environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}
