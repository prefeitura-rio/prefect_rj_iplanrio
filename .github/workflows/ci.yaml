name: CI
on:
  push:
    branches:
      - master
      - main
      - staging/**
  pull_request:
    branches:
      - master
      - main
      - staging/**
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv --profile checks shell -- bash -e {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
      - name: Restore the virtual environment
        id: venv-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'packages/toolkit/pyproject.toml', 'devenv.nix', 'devenv.lock', 'nix/**') }}
      - name: Run the checks
        run: devenv --profile checks tasks run lint:all test:all
      - name: Save the virtual environment
        if: steps.venv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: ${{ steps.venv-cache.outputs.cache-primary-key }}
  parity:
    name: Parity tests on real engines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv --profile checks shell -- bash -e {0}
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up devenv
        uses: ./.github/actions/setup-devenv
      - name: Restore the virtual environment
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', 'packages/toolkit/pyproject.toml', 'devenv.nix', 'devenv.lock', 'nix/**') }}
      - name: Sync the environment
        run: devenv --profile checks tasks run env:sync
      - name: Start Postgres, MySQL, CouchDB and MongoDB
        run: nu tests/parity/engines.nu up postgres mysql couchdb mongodb
      - name: Run the parity tests
        run: uv run --no-sync pytest -m parity tests/parity -q
      - name: Stop the engines
        if: always()
        run: nu tests/parity/engines.nu down
