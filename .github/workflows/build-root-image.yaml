name: Build root image
on:
  push:
    branches:
      - master
      - staging/main
    paths:
      - Dockerfile
      - openssl.cnf
      - .github/workflows/build-root-image.yaml
  workflow_dispatch:
    inputs:
      pipeline:
        description: Deploy only this pipeline (leave empty to deploy every pipeline)
        required: false
        type: string
concurrency:
  group: build-root-image-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    name: Build and push the root image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Log in to the GitHub container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: build
    permissions:
      contents: read
      packages: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - prod
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ matrix.environment }}
      pipeline: ${{ inputs.pipeline || '' }}
      all: ${{ inputs.pipeline == '' }}
    secrets: inherit
