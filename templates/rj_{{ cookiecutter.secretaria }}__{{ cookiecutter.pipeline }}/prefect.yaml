name: rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}-{% raw %}{{ get-commit-hash.stdout }}{% endraw %}"
    dockerfile: pipelines/rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{% raw %}{{ build-image.image_name }}{% endraw %}"
    tag: "{% raw %}{{ build-image.tag }}{% endraw %}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
- name: rj-{{ cookiecutter.secretaria | lower }}--{{ cookiecutter.pipeline }}--staging
  tags:
  - environment:staging
  - severity:{{ cookiecutter.severidade | lower }}
  - code_owner:{{ cookiecutter.code_owner | lower }}
  version: "{% raw %}{{ build-image.tag }}{% endraw %}"
  entrypoint: pipelines/rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}/flow.py:rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}
  parameters:
    database: # banco de origem e o segredo com usuario e senha
      db_type: postgres # postgres, mysql, mssql ou oracle
      host: host
      port: 5432
      database: database
      secret_path: /db-secret_path
    cloud: # ambiente de destino
      bucket: bucket-staging
      project: project-staging
      biglake_connection: project-staging.us.biglake # conexao BigLake que le a tabela Delta
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{% raw %}{{ build-image.image_name }}:{{ build-image.tag }}{% endraw %}"
      command: uv run --package rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }} -- prefect flow-run execute
      secretName: prefect-jobs-secrets-staging
      image_pull_policy: Always
- name: rj-{{ cookiecutter.secretaria | lower }}--{{ cookiecutter.pipeline }}--prod
  tags:
  - environment:prod
  - severity:{{ cookiecutter.severidade | lower }}
  - code_owner:{{ cookiecutter.code_owner | lower }}
  version: "{% raw %}{{ get-commit-hash.stdout }}{% endraw %}"
  entrypoint: pipelines/rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}/flow.py:rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}
  parameters:
    database:
      db_type: postgres
      host: host
      port: 5432
      database: database
      secret_path: /db-secret_path
    cloud:
      bucket: bucket-prod
      project: project-prod
      biglake_connection: project-prod.us.biglake
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{% raw %}{{ build-image.image_name }}:{{ build-image.tag }}{% endraw %}"
      command: uv run --package rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }} -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always

  # Cada schedule repete os grupos table, read e options inteiros: o Prefect troca o grupo, nao a chave.
  schedules:
  # Exemplo de schedule overwrite: le a tabela inteira e regrava tudo
  - interval: 86400 # executa a cada 24h
    anchor_date: "2022-01-01T01:00:00" # Data de inicio do schedule em UTC
    timezone: America/Sao_Paulo
    slug: full # slug do schedule
    parameters:
      dump_mode: overwrite
      table: # tabela no BigQuery
        dataset_id: dataset_id
        table_id: table_id
      read:
        table: public.table_name # tabela anexada: o filtro e a janela vao para o banco
        # query: "SELECT ..." # ou uma consulta nativa, no dialeto do banco (uma janela so)
  # Exemplo de schedule incremental: so grava a janela que mudou
  - interval: 86400
    anchor_date: "2022-01-01T02:32:00"
    timezone: America/Sao_Paulo
    slug: incremental
    parameters:
      dump_mode: append
      table:
        dataset_id: dataset_id
        table_id: table_id
      read:
        table: public.table_name
      options:
        batches: # janelas de uma coluna de data ou de id
          column: created_at
          width: month # day, month, year ou um numero de ids
          begin: "2024-01-01"
          lookback: 2 # relê so as duas ultimas janelas
        # filters: [{column: status, op: "!=", value: cancelado}] # so as linhas que passam
        # select: [id, created_at] # so estas colunas, na ordem; sem a chave grava todas
