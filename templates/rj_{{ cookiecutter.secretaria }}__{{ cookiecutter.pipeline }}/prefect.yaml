name: rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}-{% raw %}{{ get-commit-hash.stdout }}{% endraw %}"
    dockerfile: pipelines/rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{% raw %}{{ build-image.image_name }}{% endraw %}"
    tag: "{% raw %}{{ build-image.tag }}{% endraw %}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

{%- macro environment(env) %}
  parameters:
{%- if cookiecutter.tipo == "dump_database" %}
    database:
      type: postgres # postgres, mysql, mssql ou oracle
      host: host
      port: 5432
      database: database
      secret_path: /db-secret_path
{%- endif %}
    cloud:
      bucket: bucket-{{ env }}
      project: project-{{ env }}
      connection: project-{{ env }}.us.biglake
{%- endmacro %}

deployments:
- name: rj-{{ cookiecutter.secretaria | lower }}--{{ cookiecutter.pipeline }}--staging
  tags:
  - environment:staging
  - severity:{{ cookiecutter.severidade | lower }}
  - code_owner:{{ cookiecutter.code_owner | lower }}
  version: "{% raw %}{{ build-image.tag }}{% endraw %}"
  entrypoint: pipelines/rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}/flow.py:rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}
{{- environment("staging") }}
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{% raw %}{{ build-image.image_name }}:{{ build-image.tag }}{% endraw %}"
      command: uv run --package rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }} -- prefect flow-run execute
      secretName: prefect-jobs-secrets-staging
      image_pull_policy: Always
- name: rj-{{ cookiecutter.secretaria | lower }}--{{ cookiecutter.pipeline }}--prod
  tags:
  - environment:prod
  - severity:{{ cookiecutter.severidade | lower }}
  - code_owner:{{ cookiecutter.code_owner | lower }}
  version: "{% raw %}{{ get-commit-hash.stdout }}{% endraw %}"
  entrypoint: pipelines/rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}/flow.py:rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }}
{{- environment("prod") }}
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{% raw %}{{ build-image.image_name }}:{{ build-image.tag }}{% endraw %}"
      command: uv run --package rj_{{ cookiecutter.secretaria }}__{{ cookiecutter.pipeline }} -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always
  # O Prefect troca o grupo inteiro (table, read, options), não só uma chave.
  schedules:
  - cron: "0 1 * * *"
    timezone: America/Sao_Paulo
    slug: daily
    parameters:
      table:
        dataset_id: dataset_id
        table_id: table_id
{%- if cookiecutter.tipo == "dump_database" %}
      dump_mode: append
      read:
        table: public.table_name # ou query: "SELECT ..." (uma janela só)
      options:
        batches:
          column: created_at
          width: month # day, month, year ou um número de ids
          begin: "2024-01-01"
          lookback: 2 # relê só as duas últimas janelas
{%- elif cookiecutter.tipo == "ingest_api" %}
      dump_mode: append # overwrite troca a tabela
      url: https://api.example.gov.br/items
      records_key: data.items # caminho até a lista de registros
{%- elif cookiecutter.tipo == "dump_arcgis" %}
      dump_mode: overwrite
      url: https://services.arcgis.com/example/FeatureServer/0
      crs: EPSG:31983
{%- else %}
      dump_mode: overwrite
      spreadsheet_id: spreadsheet_id
{%- endif %}
