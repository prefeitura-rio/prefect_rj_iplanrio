[project]
name = "prefect_rj_iplanrio"
version = "0.1.0"
description = "Prefect pipelines for the Rio de Janeiro City Hall."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "google-cloud-speech",
  "idna>=3.10",
  "mutagen",
  "toolkit",
  "pandas>=2.2.3",
  "prefect==3.8.8",
  "prefect-docker>=0.7.4",
  "unidecode>=1.3.8",
]

[tool.uv]
link-mode = "copy"
constraint-dependencies = [
  "aiohttp>=3.12.15",
  "asyncssh>=2.20.0",
  "basedosdados==2.0.3",
  "beautifulsoup4>=4.12.0",
  "dbt-bigquery==1.12.1",
  "dbt-core>=1.12.6",
  "defusedxml>=0.7.1",
  "discord-py==2.5.2",
  "geopy==2.4.1",
  "gitpython==3.1.44",
  "google-api-python-client>=2.100.0",
  "google-cloud-bigquery>=3.41.0",
  "google-cloud-speech==2.32.0",
  "google-cloud-storage==2.10.0",
  "gspread>=6.0.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.2",
  "marshmallow==3.26.1",
  "mutagen==1.47.0",
  "numpy>=2.0",
  "opencage==3.0.4",
  "openlocationcode==1.0.1",
  "openpyxl>=3.1.5",
  "oracledb>=4.0.1",
  "pandas>=2.3.1",
  "pendulum==3.0.0",
  "pip>=25.1.1",
  "prefect-dbt>=0.7.5",
  "pyarrow>=24.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.2.0",
  "pytz>=2025.2",
  "requests>=2.32.4",
  "ruamel.yaml==0.18.6",
  "simplejson==3.20.1",
  "unidecode==1.3.8",
]
override-dependencies = [
  "grpcio==1.84.0",
  "grpcio-status==1.84.0",
  "click>=8.3.0,<9.0",
]

[tool.uv.sources]
toolkit = { workspace = true }
prefeitura-rio = { git = "https://github.com/prefeitura-rio/prefeitura-rio", rev = "54593ddff444158b0ecbab5514c5cde4d44012c0" }

[tool.uv.workspace]
members = ["pipelines/*", "packages/*"]

[dependency-groups]
dev = [
  "basedpyright>=1.30.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "pipelines/*/tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-m", "not parity and not cloud"]
pythonpath = ["tests", "tests/parity"]
markers = [
  "cloud: needs a working Google Cloud credential, because deltalake asks for a token even with the fake GCS",
  "extensions: needs a DuckDB extension that is downloaded the first time",
  "parity: needs the real engines that `tests/parity/engines.nu` starts",
]

[tool.basedpyright]
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
reportUnusedCallResult = false # side-effect calls (an upload, a delete) return handles that nobody needs

[[tool.basedpyright.executionEnvironments]]
root = "tests/parity"
extraPaths = ["src", "tests/parity"]
reportMissingTypeStubs = false # pymongoarrow ships no stubs
reportImplicitRelativeImport = false # the folder is on `pythonpath`, so the tests import the lab by name
reportMissingParameterType = false # pytest fixtures and parametrized arguments arrive untyped
reportUnknownParameterType = false # same cause as above
reportUnknownArgumentType = false # values from untyped fixtures
reportUnknownMemberType = false # members of untyped fixtures
reportUnknownVariableType = false # variables built from untyped fixtures
reportUnknownLambdaType = false # lambdas passed to the lab
reportAny = false # rows of the lab come from several drivers
reportArgumentType = false # rows of the lab hold values of several drivers
reportIndexIssue = false # rows of the lab hold values of several drivers
reportOperatorIssue = false # rows of the lab hold values of several drivers
reportImplicitStringConcatenation = false # the SQL of the lab is written in lines
reportPrivateImportUsage = false # the tests patch a name that the engine imports

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [
  "src",
] # resolve `import utils` from the tests folder
reportMissingParameterType = false # pytest fixtures and parametrized arguments arrive untyped
reportUnknownParameterType = false # same cause as above
reportUnknownArgumentType = false # values from untyped fixtures
reportUnknownMemberType = false # members of untyped fixtures
reportUnknownVariableType = false # variables built from untyped fixtures
reportUnannotatedClassAttribute = false # small fake classes
reportUnusedParameter = false # a fake follows the signature of the real API
reportUnknownLambdaType = false # lambdas passed to fakes
reportAny = false # values from untyped fakes

[[tool.basedpyright.executionEnvironments]]
root = "pipelines"
extraPaths = ["src", "."]
reportMissingTypeStubs = false # Google, gspread and other clients ship no types
reportUnknownMemberType = false # members of those clients
reportUnknownVariableType = false # values from those clients
reportUnknownArgumentType = false # values from those clients

[[tool.basedpyright.executionEnvironments]]
root = "src/utils/audio.py"
reportMissingTypeStubs = false # mutagen and the speech client ship no types
reportUnknownMemberType = false # members of those libraries
reportUnknownVariableType = false # values from those libraries
reportUnknownArgumentType = false # values from those libraries
reportAny = false # the speech response

[[tool.basedpyright.executionEnvironments]]
root = "src/utils/utils.py"
reportUnknownVariableType = false # google.auth types the request of `default` loosely

[[tool.basedpyright.executionEnvironments]]
root = "src/utils/tasks.py"
reportMissingTypeStubs = false # prefect_dbt ships no stubs

[[tool.basedpyright.executionEnvironments]]
root = "src/utils/hooks.py"
reportUnusedParameter = false # Prefect calls a retry check and a hook with a fixed signature

[tool.ruff]
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "PT",
  "PTH",
  "RUF",
  "T20",
  "W",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"prefect_rj_iplanrio".msg = "The package is gone: use `utils` and `toolkit`."
"iplanrio".msg = "The package is gone: use `utils` and `toolkit`."
"toolkit.pipelines_utils".msg = "The legacy modules are gone: use `utils.tasks` and `toolkit`."
"toolkit.pipelines_templates".msg = "The templates are gone: use `utils.flows.dump_database`."
"toolkit.dump".msg = "The module is gone: use `utils.flows`."
"toolkit.tasks".msg = "The module is gone: use `utils.tasks`."
"toolkit.prefect".msg = "The module is gone: write schedules in the `prefect.yaml`."

[tool.ruff.lint.per-file-ignores]
"src/utils/tasks.py" = [
  "PLR0913",
] # a task takes flat keyword parameters, so a deployment can set each one
"src/utils/flows.py" = ["PLR0913"] # same cause, for a flow
"src/utils/hooks.py" = [
  "ARG001",
] # Prefect calls a retry check and a hook with a fixed signature, and these use some of the arguments only
"tests/**" = [
  "PLR2004",
] # the expected numbers and values of an assertion are the point of a test
"tests/fixtures.py" = [
  "A002",
  "ARG002",
  "ARG003",
  "ARG005",
  "N802",
  "N815",
] # a fake follows the names and the signatures of the real API (`http.server`, the BigQuery client)
"tests/conftest.py" = [
  "ARG002",
  "ARG005",
] # a fake follows the signature of the real API, and ignores some arguments

[tool.ruff.format]
quote-style = "double"
