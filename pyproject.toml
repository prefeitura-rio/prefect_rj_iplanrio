[project]
name = "prefect_rj_iplanrio"
version = "0.1.0"
description = "Prefect pipelines for the Rio de Janeiro City Hall."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "idna>=3.10",
  "toolkit",
  "pandas>=2.2.3",
  "prefect==3.4.9",
  "prefect-docker>=0.7.1",
  "unidecode>=1.3.8",
]

[tool.uv]
link-mode = "copy"
override-dependencies = [
  "grpcio==1.78.0",
  "grpcio-status==1.78.0",
  "click>=8.3.0,<9.0",
]

[tool.uv.sources]
toolkit = { workspace = true }

[tool.uv.workspace]
members = ["pipelines/*", "packages/*"]

[dependency-groups]
dev = [
  "basedpyright>=1.30.0",
  "prefect-docker>=0.6.5",
  "pyrefly>=1.3.2",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
pythonpath = ["tests"]
markers = [
  "extensions: needs a DuckDB extension that is downloaded the first time",
]

[tool.basedpyright]
typeCheckingMode = "all"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
reportUnusedCallResult = false # side-effect calls (an upload, a delete) return handles that nobody needs

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = [
  "src",
] # resolve `import utils` from the tests folder
reportMissingParameterType = false # pytest fixtures and parametrized arguments arrive untyped
reportUnknownParameterType = false # same cause as above
reportUnknownArgumentType = false # values from untyped fixtures
reportUnknownMemberType = false # members of untyped fixtures
reportUnknownVariableType = false # variables built from untyped fixtures
reportUnannotatedClassAttribute = false # small fake classes
reportUnusedParameter = false # a fake follows the signature of the real API
reportUnknownLambdaType = false # lambdas passed to fakes
reportAny = false # values from untyped fakes

[[tool.basedpyright.executionEnvironments]]
root = "src/utils/hooks.py"
reportUnusedParameter = false # Prefect calls a retry check and a hook with a fixed signature

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.13"
python-interpreter-path = ".venv/bin/python"
search-path = ["tests"]
preset = "strict"

# The tests keep type safety on the shared code; these rules are noise for pytest code.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false  # pytest fixtures and parametrized arguments arrive untyped
implicit-any-lambda = false  # lambdas passed to fakes

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = ["ALL"]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "N",
  "PL",
  "PT",
  "PTH",
  "RUF",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"src/utils/tasks.py" = [
  "PLR0913",
] # a task takes flat keyword parameters, so a deployment can set each one
"src/utils/flows.py" = ["PLR0913"] # same cause, for a flow
"src/utils/hooks.py" = [
  "ARG001",
] # Prefect calls a retry check and a hook with a fixed signature, and these use some of the arguments only
"tests/**" = [
  "PLR2004",
] # the expected numbers and values of an assertion are the point of a test
"tests/fixtures.py" = [
  "A002",
  "ARG002",
  "ARG003",
  "N802",
  "N815",
] # a fake follows the names and the signatures of the real API (`http.server`, the BigQuery client)
"tests/conftest.py" = [
  "ARG002",
  "ARG005",
] # a fake follows the signature of the real API, and ignores some arguments

[tool.ruff.format]
quote-style = "double"
