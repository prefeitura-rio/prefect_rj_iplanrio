[project]
name = "toolkit"
version = "1.0.0"
description = "DuckDB-first shared library for the data pipelines: typed SQL execution, GCS staging, BigQuery external tables and Prefect task wrappers."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "autoregistry>=1.3.1",
  "dbt-bigquery==1.11.1",
  "deltalake>=1.6.6",
  "duckdb>=1.5.4,<2",
  "gitpython==3.1.44",
  "google-auth>=2.40.0",
  "google-cloud-bigquery>=3.42.3",
  "httpx2>=2.13.1",
  "jinja2>=3.1",
  "obstore>=0.11.1",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-logging>=0.66b1",
  "opentelemetry-sdk>=1.45.1",
  "oracledb>=4.0.1",
  "polars[pyarrow]>=2.0.0",
  "prefect==3.4.9",
  "prefect-dbt==0.7.5",
  "psycopg[binary]>=3.3.4",
  "pyarrow>=20.0.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "python-slugify>=8.0.4",
]

[dependency-groups]
dev = [
  "arro3-core>=0.6.0",
  "basedpyright>=1.30.0",
  "hypothesis>=6.165.10",
  "moto[server]>=5.1.0",
  "pyarrow-stubs>=20.0.0.20260819",
  "pyrefly>=1.3.2",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.3",
  "sqlfluff>=3.4.0",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "F",
  "FLY",
  "I",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "D104",   # an __init__.py is always empty
  "D203",   # blank line before the class docstring: conflicts with D211
  "D213",   # summary on the second line: conflicts with D212
  "E501",   # line too long: handled by the formatter
  "B008",   # function call in default argument
  "RET504", # unnecessary assignment before return: aids readability
  "TRY003", # long messages in raise
  "S106",   # hardcoded password argument: false positives on secret type names
  "ISC001", # conflicts with the formatter
  "TID252", # relative imports are the house style
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "Use polars."
"requests".msg = "Use httpx2."
"geopandas".msg = "Use DuckDB spatial."
"basedosdados".msg = "Use toolkit.bigquery and toolkit.gcs."
"google.cloud.storage".msg = "Use toolkit.gcs (obstore)."
"boto3".msg = "Use toolkit.gcs (obstore)."
"psycopg2".msg = "Read databases through toolkit.executor.sources."
"pymysql".msg = "Read databases through toolkit.executor.sources."
"pyodbc".msg = "Read databases through toolkit.executor.sources."
"aiobotocore".msg = "Use toolkit.gcs (obstore)."
"obstore".msg = "Import obstore only in toolkit/gcs.py."

[tool.ruff.lint.per-file-ignores]
"toolkit/gcs.py" = ["TID251"] # the one module that imports obstore
"tests/**" = [
  "D100",    # a test module has no module docstring
  "D101",    # the schema classes of a test are named by the test
  "D106",    # same cause, for a nested class
  "S101",    # a test checks with `assert`
  "S105",    # a test holds fake passwords and tokens
  "S106",    # same cause, as arguments
  "S603",    # a test runs the interpreter in a subprocess, with fixed code
  "S608",    # a test builds SQL for a throwaway table from fixed values
  "TID251",  # a test imports obstore and the database drivers to set up or check a fake
  "PLR2004", # a test compares with the literal that it expects
]

[tool.basedpyright]
typeCheckingMode = "all"
venvPath = "../.."
venv = ".venv"
include = ["toolkit", "tests"]
reportUnusedCallResult = false # side-effect calls return handles that nobody needs (BigQuery, dbt, DuckDB)
reportUnusedParameter = false  # a source may ignore the `client` or the `engine` that the `Source` protocol passes it

[[tool.basedpyright.executionEnvironments]]
root = "toolkit/dbt.py"
reportMissingTypeStubs = false # prefect_dbt ships no stubs

[[tool.basedpyright.executionEnvironments]]
root = "toolkit/functions/registry.py"
reportUnknownMemberType = false        # the stubs of duckdb type create_function with a pyarrow Array that has no type argument

[[tool.basedpyright.executionEnvironments]]
root = "toolkit/executor/sources/backends/gsheets.py"
reportUnknownVariableType = false                     # google-auth types its credentials loosely
reportUnknownMemberType = false                       # same cause

[[tool.basedpyright.executionEnvironments]]
root = "toolkit/oracle.py"
reportUnknownMemberType = false   # oracledb types its cursors and descriptions loosely
reportUnknownVariableType = false # same cause
reportUnknownArgumentType = false # same cause
reportAny = false                 # same cause

[[tool.basedpyright.executionEnvironments]]
root = "toolkit/executor/sources/backends/oracle.py"
reportUnknownMemberType = false   # pyarrow and oracledb type the parquet writer and the errors loosely
reportUnknownVariableType = false # same cause, for the imported writer
reportAny = false                 # the code of an oracledb error is untyped

[[tool.basedpyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]                        # resolve `import toolkit` from the tests folder
reportMissingParameterType = false        # pytest fixtures and parametrized arguments arrive untyped
reportUnknownParameterType = false        # same cause as above
reportUnknownArgumentType = false         # values from untyped fixtures
reportUnknownMemberType = false           # members of untyped fixtures
reportUnknownVariableType = false         # variables built from untyped fixtures
reportUnknownLambdaType = false           # lambdas passed to fakes
reportUnannotatedClassAttribute = false   # small fake classes
reportImplicitStringConcatenation = false # multi-line SQL and file contents
reportAny = false                         # values from untyped fakes

[tool.vulture]
ignore_decorators = ["@pytest.fixture", "@model_validator"]
ignore_names = ["model_config", "params", "exc_type", "exc", "traceback"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict = true
addopts = ["--import-mode=importlib"]
filterwarnings = [
  "ignore:Config key .* is set in model_config:UserWarning:pydantic_settings", # pydantic-settings warns about its own default config
]
markers = [
  "s3: tests that start a local S3 server",
  "extensions: tests that install a DuckDB extension (network on first run)",
]

[tool.pyrefly]
project-includes = ["toolkit", "tests"]
python-version = "3.13"
python-interpreter-path = "../../.venv/bin/python"
preset = "strict"

[[tool.pyrefly.sub-config]]
matches = "toolkit/executor/sources/registry.py"

[tool.pyrefly.sub-config.errors]
unsupported-operation = false # the registry class is subscriptable through its metaclass

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false # pytest fixtures and parametrized arguments arrive untyped
implicit-any-lambda = false    # lambdas passed to fakes
