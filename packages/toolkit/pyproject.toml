[project]
name = "toolkit"
version = "1.0.0"
description = "DuckDB-first shared library for the data pipelines: typed SQL execution, GCS staging, BigQuery external tables and Prefect task wrappers."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiobotocore>=3.9.0",
  "asyncer>=0.0.18",
  "autoregistry>=1.3.1",
  "dbt-bigquery==1.11.1",
  "duckdb>=1.5.4,<2",
  "gitpython==3.1.44",
  "google-api-python-client>=2.179.0",
  "google-auth>=2.40.0",
  "google-cloud-bigquery>=3.42.3",
  "gspread>=6.2.1",
  "jinja2>=3.1",
  "oracledb>=2.0.0",
  "polars>=1.35.2",
  "prefect==3.4.9",
  "prefect-dbt==0.7.5",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "requests>=2.32.4",
]

[dependency-groups]
dev = [
  "basedpyright>=1.30.0",
  "hypothesis>=6.165.10",
  "moto[server]>=5.1.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.9.3",
  "sqlfluff>=3.4.0",
  "types-aiobotocore[s3]>=3.9.0",
  "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "A",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "FLY",
  "I",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "T20",
  "TID",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "E501",   # line too long: handled by the formatter
  "B008",   # function call in default argument
  "RET504", # unnecessary assignment before return: aids readability
  "TRY003", # long messages in raise
  "S106",   # hardcoded password argument: false positives on secret type names
  "ISC001", # conflicts with the formatter
  "TID252", # relative imports are the house style
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pandas".msg = "Use polars."
"geopandas".msg = "Use DuckDB spatial."
"basedosdados".msg = "Use toolkit.bigquery and toolkit.gcs."
"google.cloud.storage".msg = "Use toolkit.gcs (aiobotocore)."
"boto3".msg = "Use toolkit.gcs (aiobotocore)."
"psycopg2".msg = "Read databases through toolkit.executor.sources."
"pymysql".msg = "Read databases through toolkit.executor.sources."
"pyodbc".msg = "Read databases through toolkit.executor.sources."
"aiobotocore".msg = "Import aiobotocore only in toolkit/gcs.py."

[tool.ruff.lint.per-file-ignores]
"toolkit/gcs.py" = ["TID251"]
"tests/**" = ["S101", "S105", "S106", "S608", "TID251", "PLR2004"]

[tool.basedpyright]
venvPath = "../.."
venv = ".venv"
include = ["toolkit", "tests"]
reportUnusedCallResult = false
reportUnusedParameter = false
reportAny = false
reportExplicitAny = false

[tool.vulture]
ignore_decorators = ["@pytest.fixture", "@model_validator", "@task"]
ignore_names = ["model_config", "params", "exc_type", "exc", "traceback", "S3Client", "ClientCreatorContext"]
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict = true
addopts = ["--import-mode=importlib"]
markers = [
  "s3: tests that start a local S3 server",
  "extensions: tests that install a DuckDB extension (network on first run)",
]
