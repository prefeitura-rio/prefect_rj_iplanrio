name: rj_crm__run_dbt
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_crm__run_dbt-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_crm__run_dbt/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-crm--run-dbt--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_crm__run_dbt/flow.py:rj_crm__run_dbt
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_crm__run_dbt -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_crm__run_dbt,/gke
  - name: rj-crm--run-dbt--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_crm__run_dbt/flow.py:rj_crm__run_dbt
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_crm__run_dbt -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_crm__run_dbt,/gke
    schedules:
      - interval: 86400
        anchor_date: '2023-01-01T09:00:00'
        timezone: America/Sao_Paulo
        slug: dbt_daily_freshness
        parameters:
          request:
            repository: https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-crm-registry.git
            command: source freshness
            target: prod
          report: true
      - interval: 86400
        anchor_date: '2023-01-01T10:15:00'
        timezone: America/Sao_Paulo
        slug: dbt_daily_build
        parameters:
          request:
            repository: https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-crm-registry.git
            command: build
            target: prod
            select: +tag:daily
          report: true
      - interval: 604800
        anchor_date: '2024-03-17T09:15:00'
        timezone: America/Sao_Paulo
        slug: dbt_weekly_build
        parameters:
          request:
            repository: https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-crm-registry.git
            command: build
            target: prod
            select: +tag:weekly
          report: true
      - interval: 43200
        anchor_date: '2024-03-17T09:15:00'
        timezone: America/Sao_Paulo
        slug: dbt_12h_build
        parameters:
          request:
            repository: https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-crm-registry.git
            command: build
            target: prod
            select: tag:quarter_hourly
          report: true
      - interval: 900
        anchor_date: '2024-03-17T09:15:00'
        timezone: America/Sao_Paulo
        slug: dbt_quarter_hourly_build
        parameters:
          request:
            repository: https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-crm-registry.git
            command: build
            target: prod
            select: tag:quarter_hourly
            flag: "--vars '{passe: quente}'"
          report: true
