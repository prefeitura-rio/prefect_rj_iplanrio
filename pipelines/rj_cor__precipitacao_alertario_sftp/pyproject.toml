[project]
name = "rj_cor__precipitacao_alertario_sftp"
version = "1.0.0"
description = "Coleta dados de precipitação e meteorologia do AlertaRio via arquivos XML em bucket GCS landing zone, processa e carrega em BigQuery."
dependencies = [
    "prefect_rj_iplanrio",
    "google-cloud-storage>=2.10.0",
    "pyarrow>=12.0.0",
    "defusedxml>=0.0.1",
    "pendulum>=3.0.0",
    "pandas>=2.0.0",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
