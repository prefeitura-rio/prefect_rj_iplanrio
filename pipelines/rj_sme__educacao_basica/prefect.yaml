name: rj_sme__educacao_basica
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_sme__educacao_basica-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_sme__educacao_basica/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-sme--educacao-basica--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_sme__educacao_basica/flow.py:rj_sme__educacao_basica
    parameters:
      database:
        type: mssql
        host: clustersqlsme2.rio.rj.gov.br
        port: 1433
        database: GestaoEscolar
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_sme__educacao_basica -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_sme__educacao_basica,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
  - name: rj-sme--educacao-basica--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_sme__educacao_basica/flow.py:rj_sme__educacao_basica
    parameters:
      database:
        type: mssql
        host: clustersqlsme2.rio.rj.gov.br
        port: 1433
        database: GestaoEscolar
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_sme__educacao_basica -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_sme__educacao_basica,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    schedules:
      - interval: 86400
        anchor_date: '2022-01-01T22:00:00'
        timezone: America/Sao_Paulo
        slug: aluno
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: aluno
          read:
            query: |
              SELECT
                [Ano],
                [Matricula],
                [Nome],
                [Sexo],
                [Endereco],
                [Bairro],
                [CEP],
                [Filiacao_1],
                [Filiacao_2],
                [Mora_com_Filiacao],
                [CPF],
                [NIS_Aluno],
                [NIS_Resp],
                [Raça_Cor] as Raca_Cor,
                [Cod_def],
                [Deficiência] as Deficiencia,
                [Tipo_Transporte],
                [Bolsa_Familia],
                [CFC],
                [Territorios_Sociais],
                [Clube_Escolar],
                [Nucleo_Artes],
                [Mais_Educacao],
                [DataNascimento],
                [Idade_Atual],
                [Idade_3112],
                [Turma],
                [UP_Aval],
                [Situacao],
                [Cod_Ult_Mov],
                [Ult_Movimentação] as Ult_Movimentacao,
                [Tot_Aluno],
                [alu_id],
                [tur_id]
              FROM GestaoEscolar.dbo.VW_BI_Aluno_lgpd
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:05:00'
        timezone: America/Sao_Paulo
        slug: aluno_historico
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: aluno_historico
          read:
            query: |
              SELECT
                [Ano],
                [Matricula],
                [Nome],
                [Sexo],
                [Naturalidade],
                [Nacionalidade],
                [Endereco],
                [Bairro],
                [CEP],
                [Filiacao_1],
                [Filiacao_1_Profissão],
                [Filiacao_1_Escolaridade],
                [Filiacao_2],
                [Filiacao_2_Profissão],
                [Filiacao_2_Escolaridade],
                [Mora_com_Filiacao],
                [CPF],
                [NIS_Aluno],
                [NIS_Resp],
                [Raça_Cor],
                [Cod_def],
                [Deficiência],
                [Tipo_Transporte],
                [Tempo_Deslocamento],
                [Regressa_Sozinho],
                [Religião],
                [Bolsa_Familia],
                [CFC],
                [Territorios_Sociais],
                [Clube_Escolar],
                [Nucleo_Artes],
                [Mais_Educacao],
                [DataNascimento],
                [Idade_Atual],
                [Idade_3112],
                [Situacao],
                [Cod_Ult_Mov],
                [Ult_Movimentação],
                [Tot_Aluno],
                [alu_id]
              FROM GestaoEscolar.dbo.VW_BI_Aluno_Todos_lgpd
          dump_mode: append
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:10:00'
        timezone: America/Sao_Paulo
        slug: aluno_turma
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: aluno_turma
          read:
            query: |
              SELECT
                [Ano],
                [tur_id],
                [alu_id]
              FROM GestaoEscolar.dbo.VW_BI_Aluno_Turma
          dump_mode: append
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:15:00'
        timezone: America/Sao_Paulo
        slug: avaliacao
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: avaliacao
          read:
            table: dbo.VW_BI_Avaliacao
          dump_mode: append
          options:
            select:
              - Ano
              - COC
              - tpc_nome
              - tur_codigo
              - Reunião_Pais
              - Frequencia
              - Conceito
              - GLB
              - MAT
              - POR
              - CIE
              - GEO
              - HIS
              - EFI
              - ING
              - ESP
              - FRA
              - ALE
              - AVI
              - APL
              - ACE
              - TEA
              - MUS
              - cur_id
              - crp_id
              - tur_id
              - alu_id
              - mtu_id
            chunks:
              column: Ano
              width: 1
              begin: 2020
              lookback: 1
            concurrency: 3
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:20:00'
        timezone: America/Sao_Paulo
        slug: coc
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: coc
          read:
            query: |
              SELECT
                [Ano] AS Ano,
                [CRE] AS CRE,
                [Unidade] AS Unidade,
                [Grupamento] AS Grupamento,
                [Turma] AS Turma,
                [Turno] AS Turno,
                [COC] AS COC,
                [Turmas] AS Turmas,
                [Alunos] AS Alunos,
                [Masculinos] AS Masculinos,
                [Femininos] AS Femininos,
                [Não_Def] AS Nao_Def,
                [Def] AS Def,
                [Masculinos_Não_Def] AS Masculinos_Nao_Def,
                [Masculinos_Def] AS Masculinos_Def,
                [Femininos_Não_Def] AS Femininos_Nao_Def,
                [Femininos_Def] AS Femininos_Def,
                [Vagas] AS Vagas,
                [capacidade] AS capacidade,
                [tur_id] AS tur_id,
                [pft_capacidade] AS pft_capacidade
              FROM GestaoEscolar.dbo.VW_BI_Aluno_Turma_com_COC0
          dump_mode: append
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:25:00'
        timezone: America/Sao_Paulo
        slug: dependencia
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: dependencia
          read:
            query: |
              SELECT
                [Dependencia],
                [Area_Dep],
                [Capac_Dep],
                [Tipo_Dep],
                [Dep_Aloc_Turma],
                [Dep_Util_Como],
                [Dep_Util_Como_Aloc_Turma],
                [Tot_Dep],
                [esc_id],
                [dep_id]
              FROM GestaoEscolar.dbo.VW_BI_Dependencia
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:30:00'
        timezone: America/Sao_Paulo
        slug: escola
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: escola
          read:
            query: |
              SELECT
                [CRE],
                [Designacao],
                [Denominacao],
                [Endereco],
                [Bairro],
                [CEP],
                [eMail],
                [Telefone],
                [Direçao] as Direcao,
                [MicroArea],
                [Polo],
                [Tipo_Unidade],
                [INEP],
                [SICI],
                [Salas_Recurso],
                [Salas_Aula],
                [Salas_Aula_Utilizadas],
                [Tot_Escola],
                [esc_id]
              FROM GestaoEscolar.dbo.VW_BI_Escola
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:35:00'
        timezone: America/Sao_Paulo
        slug: frequencia
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: frequencia
          read:
            table: dbo.VW_BI_Frequencia
          dump_mode: append
          options:
            chunks:
              column: dataInicio
              width: month
              begin: '2016-02-01'
              lookback: 12
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T22:40:00'
        timezone: America/Sao_Paulo
        slug: movimentacao
        parameters:
          table:
            dataset_id: brutos_educacao_basica
            table_id: movimentacao
          read:
            table: dbo.VW_BI_Movimentacao_lgpd
          dump_mode: append
          options:
            chunks:
              column: Data_mov
              width: month
              begin: '2025-01-01'
              lookback: 12
            columns:
              add_timestamp: true
