name: rj_smtr__triagem_recursos
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smtr__triagem_recursos-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smtr__triagem_recursos/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smtr--triagem-recursos--staging
    tags:
      - environment:staging
      - severity:high
      - code_owner:unassigned
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_smtr__triagem_recursos/flow.py:rj_smtr__triagem_recursos
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_smtr__triagem_recursos -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always
        memory_request: 2Gi
        memory_limit: 4Gi
        cpu_request: "1"
        cpu_limit: "2"
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: pipelines.rj_smtr__triagem_recursos
          INFISICAL_ENVIRONMENT: stg
          INFISICAL_SECRET_PATH: /smtr-triagem
    parameters:
      is_local: false
      fonte_pdf: "sei"
      executar_n2: true
      modo_execucao: "INCREMENTAL"
      limite_lote: 50
      limiar_alta: 0.85
      limiar_baixa: 0.50
      limiar_dispersao: 0.50
      infisical_secret_path: "/smtr-triagem"

  - name: rj-smtr--triagem-recursos--prod
    tags:
      - environment:prod
      - severity:high
      - code_owner:unassigned
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_smtr__triagem_recursos/flow.py:rj_smtr__triagem_recursos
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_smtr__triagem_recursos -- prefect flow-run execute
        secretName: prefect-jobs-secrets
        image_pull_policy: Always
        memory_request: 2Gi
        memory_limit: 4Gi
        cpu_request: "1"
        cpu_limit: "2"
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: pipelines.rj_smtr__triagem_recursos
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_SECRET_PATH: /smtr-triagem
    parameters:
      is_local: false
      fonte_pdf: "sei"
      executar_n2: true
      modo_execucao: "INCREMENTAL"
      limite_lote: 300
      limiar_alta: 0.85
      limiar_baixa: 0.50
      limiar_dispersao: 0.50
      infisical_secret_path: "/smtr-triagem"
    schedules:
      - interval: 86400
        anchor_date: "2026-01-01T03:00:00"
        timezone: America/Sao_Paulo
        slug: triagem_recursos_smtr_diario
        parameters:
          is_local: false
          fonte_pdf: "sei"
          executar_n2: true
          modo_execucao: "INCREMENTAL"
          limite_lote: 300
          limiar_alta: 0.85
          limiar_baixa: 0.50
          limiar_dispersao: 0.50
          infisical_secret_path: "/smtr-triagem"
