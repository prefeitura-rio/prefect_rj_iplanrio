[project]
name = "rj-smtr-triagem-recursos"
version = "1.0.0"
description = "Automated triage and selective classification of traffic citation appeals for SMTR-RJ using LLM reasoning and tabular meta-calibration."
requires-python = ">=3.14,<3.15"
dependencies = [
    "prefect_rj_iplanrio",
    "pydantic",
    "numpy",
    "scipy",
    "polars>=1.0.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "joblib>=1.4.2",
    "rapidfuzz>=3.10.0",
    "pymupdf>=1.24.10",
    "pytesseract>=0.3.13",
    "google-genai>=0.3.0",
    "psycopg2-binary>=2.9.10",
    "pillow>=7.1.0",
    "openai>=1.40.0",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "flow.py",
    "tasks.py",
    "constants.py",
    "utils",
    "queries",
]
