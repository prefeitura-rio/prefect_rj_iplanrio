name: rj_smfp__nota_carioca_extracao_xml
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smfp__nota_carioca_extracao_xml-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smfp__nota_carioca_extracao_xml/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smfp--nota-carioca-extracao-xml--staging
    tags:
      - environment:staging
      - severity:low
      - code_owner:fredzolio
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_smfp__nota_carioca_extracao_xml/flow.py:rj_smfp__nota_carioca_extracao_xml
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      url: https://notacariocahom.rio.gov.br/intranet/RotinasAutomaticas.asmx
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_smfp__nota_carioca_extracao_xml -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical-dados
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://secrets.dados.rio
          INFISICAL_PROJECT_ID: 5cf5bfc3-e53f-4156-91f6-75714414a316
          INFISICAL_ENVIRONMENT: stg
          INFISICAL_PATHS: /rj_smfp__nota_carioca_extracao_xml,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
        cpu_request: 250m
        cpu_limit: 250m
        memory_request: 512Mi
        memory_limit: 512Mi
  - name: rj-smfp--nota-carioca-extracao-xml--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:fredzolio
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_smfp__nota_carioca_extracao_xml/flow.py:rj_smfp__nota_carioca_extracao_xml
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    parameters:
      url: https://notacarioca.rio.gov.br/intranet/RotinasAutomaticas.asmx
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_smfp__nota_carioca_extracao_xml -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical-dados
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://secrets.dados.rio
          INFISICAL_PROJECT_ID: 5cf5bfc3-e53f-4156-91f6-75714414a316
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_smfp__nota_carioca_extracao_xml,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
        cpu_request: 250m
        cpu_limit: 250m
        memory_request: 512Mi
        memory_limit: 512Mi
