name: rj_sms__sisreg_disparo_lembretes
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_sms__sisreg_disparo_lembretes-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_sms__sisreg_disparo_lembretes/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-sms--sisreg-disparo-lembretes--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_sms__sisreg_disparo_lembretes/flow.py:rj_sms__sisreg_disparo_lembretes
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_sms__sisreg_disparo_lembretes -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 38db61c8-a9b7-433a-899b-55218586b57b
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /shared
    parameters:
      table:
        dataset_id: disparos
        table_id: disparos_efetuados
      dispatch:
        billing_project_id: rj-crm-registry
        id_hsm: 18
        campaign_name: SISREG_AGENDAMENTOS
        cost_center_id: 71
        chunk_size: 1000
      dump_mode: append
  - name: rj-sms--sisreg-disparo-lembretes--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_sms__sisreg_disparo_lembretes/flow.py:rj_sms__sisreg_disparo_lembretes
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_sms__sisreg_disparo_lembretes -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 38db61c8-a9b7-433a-899b-55218586b57b
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /shared
    parameters:
      table:
        dataset_id: disparos
        table_id: disparos_efetuados_staging
      dispatch:
        billing_project_id: rj-crm-registry-dev
        id_hsm: 18
        campaign_name: SISREG_AGENDAMENTOS_STAGING
        cost_center_id: 71
        chunk_size: 100
      dump_mode: append
