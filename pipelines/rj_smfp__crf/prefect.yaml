name: rj_smfp__crf
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smfp__crf-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smfp__crf/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smfp--crf--staging
    tags:
      - environment:staging
      - severity:high
      - code_owner:tricktx
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_smfp__crf/flow.py:rj_smfp__crf
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_smfp__crf -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_smfp__crf,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
  - name: rj-smfp--crf--prod
    tags:
      - environment:prod
      - severity:high
      - code_owner:tricktx
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_smfp__crf/flow.py:rj_smfp__crf
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_smfp__crf -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_smfp__crf,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    schedules:
      - interval: 86400
        anchor_date: "2021-01-01T01:00:00"
        timezone: America/Sao_Paulo
        slug: crf-periodos-simples
        parameters:
          table_id: periodos_simples
          dataset_id: brutos_crf
      - interval: 86400
        anchor_date: "2021-01-01T01:10:00"
        timezone: America/Sao_Paulo
        slug: crf-periodos-mei
        parameters:
          table_id: periodos_mei
          dataset_id: brutos_crf
      - interval: 86400
        anchor_date: "2021-01-01T01:20:00"
        timezone: America/Sao_Paulo
        slug: crf-eventos-simples
        parameters:
          table_id: eventos_simples
          dataset_id: brutos_crf
      - interval: 86400
        anchor_date: "2021-01-01T01:30:00"
        timezone: America/Sao_Paulo
        slug: crf-eventos-mei
        parameters:
          table_id: eventos_mei
          dataset_id: brutos_crf
