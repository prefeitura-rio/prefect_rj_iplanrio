name: rj_crm__relatorio_salesforce
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_crm__relatorio_salesforce-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_crm__relatorio_salesforce/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj_crm__relatorio_salesforce--staging
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_crm__relatorio_salesforce/flow.py:rj_crm__relatorio_salesforce
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_crm__relatorio_salesforce -- prefect flow-run execute
        secretName: prefect-jobs-crm-registry-secrets-staging
        image_pull_policy: Always
    parameters:
      dump_mode: append

  - name: rj_crm__relatorio_salesforce--prod
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_crm__relatorio_salesforce/flow.py:rj_crm__relatorio_salesforce
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_crm__relatorio_salesforce -- prefect flow-run execute
        secretName: prefect-jobs-crm-registry-secrets
        image_pull_policy: Always
    parameters:
      dump_mode: append
    schedules:
      - cron: "0 9 1 * *" # todo dia 1 do mes, 09:00
        anchor_date: "2024-01-01T09:00:00"
        timezone: America/Sao_Paulo
        active: true
        slug: monthly-relatorio-salesforce-prod
        flow_run_name: rj_crm__relatorio_salesforce_monthly_run
        deployment_name: rj-crm--relatorio-salesforce--prod
        parameters:
          dump_mode: append
