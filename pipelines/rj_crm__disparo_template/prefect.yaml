name: rj_crm__disparo_template
prefect-version: 3.4.3
build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__disparo_template-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__disparo_template/Dockerfile
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: '{{ build-image.image_name }}'
      tag: '{{ build-image.tag }}'
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio
deployments:

  - name: rj-crm--disparo-template-sf--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_crm__disparo_template/flow.py:rj_crm__disparo_template
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_crm__disparo_template -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_crm__disparo_template,/shared
    parameters:
      campaign:
        name: disparo-template-sf
      table:
        dataset_id: brutos_wetalkie
        table_id: disparos_efetuados_sf
  - name: rj-crm--disparo-template-sf--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_crm__disparo_template/flow.py:rj_crm__disparo_template
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_crm__disparo_template -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_crm__disparo_template,/shared
    parameters:
      campaign:
        name: disparo-template-sf
      table:
        dataset_id: brutos_wetalkie
        table_id: disparos_efetuados_sf
    schedules:
      - cron: "0 11 * * 1-5"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-smtr-multa-pf
        flow_run_name: smtr-multa-pf
        parameters:
          campaign:
            environment: production
            name: smtrmultasdetransitov1
          table:
            dataset_id: brutos_salesforce
            table_id: disparos_efetuados
          audience:
            drop_duplicate_cpfs: true
            query_file: queries/smtr_multa_pf.sql
          delivery:
            data_extension: whatsapp_smtr_multas_transito
            columns: ["nome_proprietario", "descricao_veiculo", "placa_veiculo", "id_autuacao"]
      - cron: "0 11 * * *"
