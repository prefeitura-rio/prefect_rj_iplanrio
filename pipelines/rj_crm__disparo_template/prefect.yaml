name: rj_crm__disparo_template
prefect-version: 3.4.3
build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__disparo_template-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__disparo_template/Dockerfile
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: '{{ build-image.image_name }}'
      tag: '{{ build-image.tag }}'
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio
deployments:

  - name: rj-crm--disparo-template-sf--staging
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_crm__disparo_template/flow.py:rj_crm__disparo_template_sf
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: "uv run --package rj_crm__disparo_template -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets-staging
        image_pull_policy: Always
    parameters:
      campaign_name: disparo-template-sf
      dataset_id: brutos_wetalkie
      table_id: disparos_efetuados_sf
      dump_mode: append
      filter_dispatched_phones_or_cpfs: cpf
      filter_duplicated_phones: false
      filter_duplicated_cpfs: true
    schedules:
      # Disparo emergencial (ex: ventos fortes)
      - cron: "0 11 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: oneshot-disparo-emergencial
        flow_run_name: disparo-emergencial
        parameters:
          flow_environment: staging
          campaign_name: ventos_fortes_v1
          data_extension_filename: whatsapp_alerta_ventos_emergencial
          de_columns: ["nome"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_duplicated_phones: true
          filter_duplicated_cpfs: true
          query_file: queries/cvl_disparo_em_massa.sql
          batch_size: 10000
          batch_sleep_minutes: 5

      # Cadunico com cadastro desatualizado
      - cron: "0 11 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: oneshot-smas_cadunico_desatualizado
        flow_run_name: smas_cadunico_desatualizado
        parameters:
          flow_environment: staging
          campaign_name: smas_cadunico_desatualizado
          data_extension_filename: whatsapp_desatualizado_cadunico
          de_columns: ["nome", "crianca", "protocolo", "id_crianca", "bairro", "id_familia", "cpf_crianca", "estrategia_envio", "confianca", "qualidade"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_duplicated_cpfs: false
          query_file: queries/smas_cadunico_desatualizado_pic.sql
          batch_size: 10000
          batch_sleep_minutes: 5

      # Multas de transito (SMTR)
      - cron: "0 11 * * 1-5"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-smtr-multa-pf
        flow_run_name: smtr-multa-pf
        parameters:
          flow_environment: staging
          campaign_name: smtrmultasdetransitov1
          data_extension_filename: whatsapp_smtr_multas_transito
          de_columns: ["nome_proprietario", "descricao_veiculo", "placa_veiculo",
            "id_autuacao"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_duplicated_cpfs: true
          query_file: queries/smtr_multa_pf.sql

      # Ciclo de vida da pesquisa 1746 (unificado)
      - cron: "0 11 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-cvl-pesquisa1746-unificado
        flow_run_name: cvl-pesquisa1746
        parameters:
          flow_environment: staging
          query_replacements: {"id_hsm_com_solucao_placeholder": 192, "nome_hsm_com_solucao_placeholder": "cvl_pesquisa_1746_prod_v1",
            "id_hsm_sem_resolucao_placeholder": 291, "nome_hsm_sem_resolucao_placeholder": "cvl_pesquisa_1746_sem_resolucao_prod_v1"}
          campaign_name: cvl_pesquisa_1746_prod_v1
          data_extension_filename: whatsapp_cvl_pesquisa_1746
          de_columns: ["cc_wt_nome_sobrenome", "cc_wt_solicitacao", "cc_wt_canal",
            "protocolo", "STATUS_DEMANDA", "cpfCnpj", "NOME_ARQUIVO", "cc_wt_id_chamado",
            "cc_wt_id_subtipo"]
          csv_separator: ","
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_duplicated_phones: true
          filter_duplicated_cpfs: true
          query_file: queries/cvl_pesquisa_1746.sql

      # Divida ativa cobrança
      - cron: "30 9 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-pgm-divida-ativa-prod
        flow_run_name: pgm-divida-ativa
        parameters:
          flow_environment: staging
          query_replacements: {"nome_hsm_cobranca_placeholder": "pgm_divida_ativa_prod_v2",
            "id_hsm_legado_cobranca_placeholder": "196, 239"}
          campaign_name: pgm_divida_ativa_prod_v2
          data_extension_filename: whatsapp_pgm_divida_ativa_cobranca
          enrich_with_api_name: consulta_debitos
          enrich_with_api_params:
            api_url: "https://services.pref.rio/mcp/consulta_debitos"
          de_columns: ["cpfCnpj", "nome_sobrenome", "api_resposta_sucesso", "lista_cdas",
            "lista_guias", "dicionario_itens", "total_itens_pagamento", "mensagem_divida_contribuinte",
            "guias_quantidade_total", "efs_cdas_quantidade_total", "total_nao_parcelado",
            "total_parcelado", "debitos_msg", "itens_informados"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_dispatched_phones_or_cpfs:
          filter_duplicated_cpfs: true
          query_file: queries/pgm_divida_ativa_cobranca.sql

      # Divida ativa lembrete
      - cron: "0 13 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-pgm-divida-ativa-lembrete-prod-v1
        flow_run_name: pgm-divida-ativa-lembrete
        parameters:
          flow_environment: staging
          query_replacements: {"nome_hsm_cobranca_placeholder": "pgm_divida_ativa_prod_v2",
            "nome_hsm_lembrete_placeholder": "pgmdividaativalembreteprodv1", "id_hsm_legado_cobranca_placeholder": "196,
              239", "id_hsm_legado_lembrete_placeholder": "227"}
          campaign_name: pgmdividaativalembreteprodv1
          data_extension_filename: whatsapp_pgm_divida_ativa_lembrete
          de_columns: ["nome_sobrenome", "data_vencimento", "numero_guia", "valor_guia",
            "cod_pix", "cod_boleto"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_dispatched_phones_or_cpfs:
          filter_duplicated_cpfs: false
          query_file: queries/pgm_divida_ativa_lembrete.sql

      # Divida ativa agradecimento
      - cron: "0 13 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-pgm-divida-ativa-confirma-pgto-prod-v1
        flow_run_name: pgm-divida-ativa-confirma-pgto-prod-v1
        parameters:
          flow_environment: staging
          query_replacements: {"nome_hsm_cobranca_placeholder": "pgm_divida_ativa_prod_v2",
            "nome_hsm_lembrete_placeholder": "pgmdividaativalembreteprodv1", "nome_hsm_agradecimento_placeholder": "pgmdividaativaconfirmapgtoprodv1",
            "id_hsm_legado_cobranca_placeholder": "196, 239", "id_hsm_legado_lembrete_placeholder": "227",
            "id_hsm_legado_agradecimento_placeholder": "231"}
          campaign_name: pgmdividaativaconfirmapgtoprodv1
          data_extension_filename: whatsapp_pgm_divida_ativa_agradecimento
          de_columns: ["nome_sobrenome"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_dispatched_phones_or_cpfs:
          filter_duplicated_phones: true
          filter_duplicated_cpfs: true
          query_file: queries/pgm_divida_ativa_agradecimento.sql

      # Puérpera confirma agendamento
      - cron: "0 10 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-sms-puerpera-confirma-agendamento
        flow_run_name: sms-puerpera-confirma-agendamento
        parameters:
          flow_environment: staging
          query_replacements:
            nome_hsm_placeholder: _sms_puerpera_disp1_gestantev2
            intervalo_filtro_disparados: 1
            id_hsm_legado_placeholder: 573
          table_id: disparos_efetuados
          dataset_id: brutos_salesforce
          campaign_name: _sms_puerpera_disp1_gestantev2
          data_extension_filename: whatsapp_sms_puerperas_confirma_agendamento
          de_columns: ["nome", "maternidade", "data", "hora"]
          max_dispatch_retries: 0
          whitelist_percentage: 0
          whitelist_environment: production
          filter_duplicated_cpfs: true
          filter_dispatched_phones_or_cpfs:
          filter_failed_phones: false
          force_add_on_whitelist_group: true
          whitelist_replace_contacts: true
          query_file: queries/sms_puerpera_confirma_agendamento.sql

      # Puérpera D0 - Explicação pesquisa
      - cron: "0 14 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-sms-puerperas-d0
        flow_run_name: sms-puerperas-d0
        parameters:
          flow_environment: staging
          query_replacements:
            nome_hsm_placeholder: smspuerperasdisparo25
            intervalo_filtro_disparados: 365
            id_hsm_legado_placeholder: 610
          table_id: disparos_efetuados
          dataset_id: brutos_salesforce
          campaign_name: smspuerperasdisparo25
          data_extension_filename: whatsapp_sms_puerperas_explica_pesquisa
          de_columns: ["nome", "maternidade"]
          max_dispatch_retries: 0
          whitelist_percentage: 0
          whitelist_environment: production
          filter_duplicated_cpfs: true
          filter_dispatched_phones_or_cpfs:
          filter_failed_phones: false
          force_add_on_whitelist_group: true
          whitelist_replace_contacts: true
          query_file: queries/sms_puerperas_d0_explica_pesquisa.sql

      # Puérpera D1/D3/D5/D10/D13/D16/D19 - Pesquisa 1
      - cron: "0 10 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-sms-puerperas-d1-d3-d5-d10-d13-d16-d19
        flow_run_name: sms-puerperas-d1-d3-d5-d10-d13-d16-d19
        parameters:
          flow_environment: staging
          query_replacements:
            nome_hsm_placeholder: smspuerperasdisparo4v3
            nome_hsm_anterior_placeholder: smspuerperasdisparo25
            # IDs numéricos legados da Wetalkie (pré-migração pra status_disparo), usados
            # como fallback de "já disparado" enquanto a status_disparo não tem histórico completo.
            # 588 = antiga Pesquisa 1 (D1/3/5/10), 562 = antiga Pesquisa 3 (D13/16/19), unificadas aqui.
            id_hsm_legado_placeholder: "588, 562"
            id_hsm_anterior_legado_placeholder: 610
            pesquisa_id: "Pesquisa 1"
            datas_internacao: |
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 1 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 3 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 5 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 10 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 13 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 16 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 19 DAY)
            intervalo_filtro_disparados: 1
          table_id: disparos_efetuados
          dataset_id: brutos_salesforce
          campaign_name: smspuerperasdisparo4v3
          data_extension_filename: whatsapp_sms_puerperas_pesquisa1
          de_columns: ["nome", "maternidade"]
          max_dispatch_retries: 0
          whitelist_percentage: 0
          whitelist_environment: production
          filter_duplicated_cpfs: true
          filter_dispatched_phones_or_cpfs:
          filter_failed_phones: false
          force_add_on_whitelist_group: true
          whitelist_replace_contacts: true
          query_file: queries/sms_puerperas_pesquisa_template.sql

      # Puérpera D7/D22 - Pesquisa 4
      - cron: "0 10 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-sms-puerperas-d7-d22
        flow_run_name: sms-puerperas-d7-d22
        parameters:
          flow_environment: staging
          query_replacements:
            nome_hsm_placeholder: smspuerperadisparo6
            nome_hsm_anterior_placeholder: smspuerperasdisparo25
            id_hsm_legado_placeholder: "456, 489"
            id_hsm_anterior_legado_placeholder: 610
            pesquisa_id: "Pesquisa 4"
            datas_internacao: |
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 7 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 22 DAY)
            intervalo_filtro_disparados: 1
          table_id: disparos_efetuados
          dataset_id: brutos_salesforce
          campaign_name: smspuerperadisparo6
          data_extension_filename: whatsapp_sms_puerperas_pesquisa4
          de_columns: ["nome", "numero_dias", "maternidade"] # única pesquisa cuja hsm usa a variável numero_dias
          max_dispatch_retries: 0
          whitelist_percentage: 0
          whitelist_environment: production
          filter_duplicated_cpfs: true
          filter_dispatched_phones_or_cpfs:
          filter_failed_phones: false
          force_add_on_whitelist_group: true
          whitelist_replace_contacts: true
          query_file: queries/sms_puerperas_pesquisa_template.sql

      # Puérpera D25/D28/D34 - Pesquisa 5
      - cron: "0 10 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-sms-puerperas-d25-d28-d34
        flow_run_name: sms-puerperas-d25-d28-d34
        parameters:
          flow_environment: staging
          query_replacements:
            nome_hsm_placeholder: smspuerperasdisparo12
            nome_hsm_anterior_placeholder: smspuerperasdisparo25
            # 564 = antiga Pesquisa 5 (D25/28), 566 = antiga Pesquisa 6 (D34), unificadas aqui.
            id_hsm_legado_placeholder: "564, 566"
            id_hsm_anterior_legado_placeholder: 610
            pesquisa_id: "Pesquisa 5"
            datas_internacao: |
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 25 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 28 DAY),
              DATE_ADD(DATE(data_alta_internacao), INTERVAL 34 DAY)
            intervalo_filtro_disparados: 1
          table_id: disparos_efetuados
          dataset_id: brutos_salesforce
          campaign_name: smspuerperasdisparo12
          data_extension_filename: whatsapp_sms_puerperas_pesquisa5
          de_columns: ["nome", "maternidade"]
          max_dispatch_retries: 0
          whitelist_percentage: 0
          whitelist_environment: production
          filter_duplicated_cpfs: true
          filter_dispatched_phones_or_cpfs:
          filter_failed_phones: false
          force_add_on_whitelist_group: true
          whitelist_replace_contacts: true
          query_file: queries/sms_puerperas_pesquisa_template.sql

      # Puérpera D40 - Pesquisa 7
      - cron: "0 10 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-sms-puerperas-d40
        flow_run_name: sms-puerperas-d40
        parameters:
          flow_environment: staging
          query_replacements:
            nome_hsm_placeholder: smspuerperasdisparo152
            nome_hsm_anterior_placeholder: smspuerperasdisparo25
            id_hsm_legado_placeholder: 589
            id_hsm_anterior_legado_placeholder: 610
            pesquisa_id: "Pesquisa 7"
            datas_internacao: "DATE_ADD(DATE(data_alta_internacao), INTERVAL 40 DAY)"
            intervalo_filtro_disparados: 1
          table_id: disparos_efetuados
          dataset_id: brutos_salesforce
          campaign_name: smspuerperasdisparo152
          data_extension_filename: whatsapp_sms_puerperas_pesquisa7
          de_columns: ["nome", "maternidade"]
          max_dispatch_retries: 0
          whitelist_percentage: 0
          whitelist_environment: production
          filter_duplicated_cpfs: true
          filter_dispatched_phones_or_cpfs:
          filter_failed_phones: false
          force_add_on_whitelist_group: true
          whitelist_replace_contacts: true
          query_file: queries/sms_puerperas_pesquisa_template.sql

      # Confirmação de agendamento do CadÚnico
      - cron: "0 13 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-cadunico-confirma-agendamento
        flow_run_name: cadunico-confirma-agendamento
        parameters:
          flow_environment: staging
          query_replacements: {"days_ahead_placeholder": 2, "nome_hsm_placeholder": "confirma_agendamento_cadunico_prod_v2",
            "intervalo_filtro_disparados": 1, "id_hsm_legado_placeholder": 101}
          campaign_name: confirma_agendamento_cadunico_prod_v2
          data_extension_filename: whatsapp_cadunico_
          de_columns: ["nome_sobrenome", "unidade_cras", "data", "hora", "endereco"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_dispatched_phones_or_cpfs:
          filter_duplicated_cpfs: true
          query_file: queries/cadunico_confirma_agendamento.sql

      # Confirmação evento Cartao PIC
      - cron: "0 12 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-smas-cartaopic-evento
        flow_run_name: smas-cartaopic-evento
        parameters:
          flow_environment: staging
          query_replacements: {"nome_hsm_placeholder": "smascartaoprimeirainfanciaprodv27",
            "intervalo_filtro_disparados": 150, "id_hsm_legado_placeholder": 184}
          campaign_name: smascartaoprimeirainfanciaprodv27
          data_extension_filename: whatsapp_smas_cartaopic_evento
          de_columns: ["nome_sobrenome", "endereco", "data", "horario"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_dispatched_phones_or_cpfs:
          filter_duplicated_cpfs: false
          whitelist_percentage: 0
          whitelist_environment: "production"
          filter_failed_phones: false
          query_file: queries/smas_cartaopic_evento.sql

      # Lembrete evento Cartao PIC
      - cron: "0 12 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-smas-cartaopic-lembrete
        flow_run_name: smas-cartaopic-lembrete
        parameters:
          flow_environment: staging
          query_replacements: {"nome_hsm_placeholder": "smascartaoprimeirainfancialembreteprodv4",
            "intervalo_filtro_disparados": 150, "id_hsm_legado_placeholder": 185}
          campaign_name: smascartaoprimeirainfancialembreteprodv4
          data_extension_filename: whatsapp_smas_cartaopic_lembrete
          de_columns: ["nome_sobrenome", "endereco", "data", "horario"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_dispatched_phones_or_cpfs:
          filter_duplicated_cpfs: false
          query_file: queries/smas_cartaopic_lembrete.sql

  - name: rj-crm--disparo-template-sf--prod
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_crm__disparo_template/flow.py:rj_crm__disparo_template_sf
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: "uv run --package rj_crm__disparo_template -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets
        image_pull_policy: Always
    parameters:
      campaign_name: disparo-template-sf
      dataset_id: brutos_wetalkie
      table_id: disparos_efetuados_sf
      dump_mode: append
      filter_dispatched_phones_or_cpfs: cpf
      filter_duplicated_cpfs: true

    schedules:
      # Multa SMTR PF
      - cron: "0 11 * * 1-5"
        timezone: America/Sao_Paulo
        active: false
        slug: daily-smtr-multa-pf
        flow_run_name: smtr-multa-pf
        parameters:
          flow_environment: production
          campaign_name: smtrmultasdetransitov1
          data_extension_filename: whatsapp_smtr_multas_transito
          de_columns: ["nome_proprietario", "descricao_veiculo", "placa_veiculo",
            "id_autuacao"]
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_duplicated_cpfs: true
          query_file: queries/smtr_multa_pf.sql
  # Daily schedule para flow cvl-pesquisa1746 (unifica com solução + sem resolução num único
  # CSV/Data Extension; STATUS_DEMANDA distingue as duas linhas e a Journey no Salesforce
  # decide qual HSM enviar por linha)
      - cron: "0 11 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: daily-cvl-pesquisa1746-unificado
        flow_run_name: cvl-pesquisa1746
        parameters:
          flow_environment: production
          query_replacements: {"id_hsm_com_solucao_placeholder": 192, "nome_hsm_com_solucao_placeholder": "cvl_pesquisa_1746_prod_v1",
            "id_hsm_sem_resolucao_placeholder": 291, "nome_hsm_sem_resolucao_placeholder": "cvl_pesquisa_1746_sem_resolucao_prod_v1"}
          campaign_name: cvl_pesquisa_1746_prod_v1
          data_extension_filename: whatsapp_cvl_pesquisa_1746
          de_columns: ["cc_wt_nome_sobrenome", "cc_wt_solicitacao", "cc_wt_canal",
            "protocolo", "STATUS_DEMANDA", "cpfCnpj", "NOME_ARQUIVO", "cc_wt_id_chamado",
            "cc_wt_id_subtipo"]
          csv_separator: ","
          dataset_id: brutos_salesforce
          table_id: disparos_efetuados
          filter_duplicated_phones: true
          filter_duplicated_cpfs: true
          query_file: queries/cvl_pesquisa_1746.sql

      # PGM Dívida Ativa
      - cron: "30 9 * * 1-5"
        timezone: America/Sao_Paulo
        active: true
        slug: daily-pgm-divida-ativa-prod
        flow_run_name: pgm-divida-ativa
        parameters:
          flow_environment: production
          query_replacements: {"nome_hsm_cobranca_placeholder": "pgm_divida_ativa_prod_v2",
