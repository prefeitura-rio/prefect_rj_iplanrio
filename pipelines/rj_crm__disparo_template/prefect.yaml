            name: cvl_pesquisa_1746_prod_v1
          table:
            dataset_id: brutos_salesforce
            table_id: disparos_efetuados
          audience:
            replacements: {"id_hsm_com_solucao_placeholder": 192, "nome_hsm_com_solucao_placeholder": "cvl_pesquisa_1746_prod_v1", "id_hsm_sem_resolucao_placeholder": 291, "nome_hsm_sem_resolucao_placeholder": "cvl_pesquisa_1746_sem_resolucao_prod_v1"}
