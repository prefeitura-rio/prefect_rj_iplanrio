[project]
name = "rj_cvl__osinfo_mongo"
version = "0.1.0"
description = "Download and reconstruct PDFs from OSINFO MongoDB, partitioned by mes_envio, into GCS."
requires-python = ">=3.13,<3.14"
dependencies = [
    "iplanrio",
    "prefect==3.4.9",
    "pymongo>=3.11,<4",
    "tenacity>=9.1.4",
]

[tool.uv]
link-mode = "copy"
override-dependencies = ["grpcio==1.78.0", "grpcio-status==1.78.0", "click>=8.3.0,<9.0"]

[tool.uv.sources]
iplanrio = { git = "https://github.com/prefeitura-rio/iplanrio.git" }
