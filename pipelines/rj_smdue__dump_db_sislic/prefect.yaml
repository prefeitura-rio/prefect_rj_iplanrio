name: rj_smdue__dump_db_sislic
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smdue__dump_db_sislic-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smdue__dump_db_sislic/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smdue--dump-db-sislic--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_smdue__dump_db_sislic/flow.py:rj_smdue__dump_db_sislic
    parameters:
      database:
        type: mssql
        host: 10.2.221.101
        port: 1433
        database: SMU_PRD
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smdue__dump_db_sislic -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-rj-smdue--dump-db-sislic
        image_pull_policy: Always
  - name: rj-smdue--dump-db-sislic--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
