name: rj_cgm__osinfo_rh
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_cgm__osinfo_rh-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_cgm__osinfo_rh/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-cgm--osinfo-rh--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_cgm__osinfo_rh/flow.py:rj_cgm__osinfo_rh
    parameters:
      database:
        type: mysql
        host: 10.70.4.188
        port: 3306
        database: rh
        options:
          charset: legacy
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_cgm__osinfo_rh -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_cgm__osinfo_rh,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
  - name: rj-cgm--osinfo-rh--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_cgm__osinfo_rh/flow.py:rj_cgm__osinfo_rh
    parameters:
      database:
        type: mysql
        host: 10.70.4.188
        port: 3306
        database: rh
        options:
          charset: legacy
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_cgm__osinfo_rh -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_cgm__osinfo_rh,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    schedules:
      - interval: 86400
        anchor_date: '2022-01-01T07:00:00'
        timezone: America/Sao_Paulo
        slug: dc_conselho
        parameters:
          table:
            dataset_id: brutos_osinfo_rh
            table_id: dc_conselho
