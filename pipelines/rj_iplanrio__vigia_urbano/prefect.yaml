name: rj_iplanrio__vigia_urbano
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_iplanrio__vigia_urbano-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_iplanrio__vigia_urbano/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-iplanrio--vigia-urbano--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_iplanrio__vigia_urbano/flow.py:rj_iplanrio__vigia_urbano
    parameters:
      database:
        type: mysql
        host: srv000140.infra.rio.gov.br
        port: 3306
        database: vigiaurbano
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_iplanrio__vigia_urbano -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_iplanrio__vigia_urbano,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
  - name: rj-iplanrio--vigia-urbano--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_iplanrio__vigia_urbano/flow.py:rj_iplanrio__vigia_urbano
    parameters:
      database:
        type: mysql
        host: srv000140.infra.rio.gov.br
        port: 3306
        database: vigiaurbano
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_iplanrio__vigia_urbano -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_iplanrio__vigia_urbano,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    schedules:
      - interval: 3600
        anchor_date: '2022-01-01T01:00:00'
        timezone: America/Sao_Paulo
        slug: vw_RespostaOcorrencia
        parameters:
          table:
            dataset_id: brutos_formulario_ocorrencia
            table_id: vw_RespostaOcorrencia
          read:
            query: |
              SELECT *
              FROM vigiaurbano.vw_RespostaOcorrencia
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
          dbt:
            repository: https://github.com/prefeitura-rio/queries-rj-iplanrio
            command: run
            target: prod
            select: raw_vigia_urbano__vw_resposta_ocorrencia
