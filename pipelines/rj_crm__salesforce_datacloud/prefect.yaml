name: rj_crm__salesforce_datacloud
prefect-version: 3.4.3
build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__salesforce_datacloud-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__salesforce_datacloud/Dockerfile
push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: '{{ build-image.image_name }}'
      tag: '{{ build-image.tag }}'
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio
deployments:

  - name: rj-crm--salesforce-datacloud--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_crm__salesforce_datacloud/flow.py:salesforce_datacloud
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: "uv run --package rj_crm__salesforce_datacloud -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets-staging
        image_pull_policy: Always
    parameters:
      dataset_id: brutos_salesforce_staging
      environment: staging
    schedules:
      - cron: "*/15 * * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: datacloud-teste-15min

  - name: rj-crm--salesforce-datacloud--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_crm__salesforce_datacloud/flow.py:salesforce_datacloud
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: "uv run --package rj_crm__salesforce_datacloud -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets
        image_pull_policy: Always
    parameters:
      environment: prod
      dataset_id: brutos_salesforce_staging
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    schedules:
      - cron: "*/15 * * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: datacloud-producao-15min
        parameters:
          modo: hora
      - cron: "15 0 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: datacloud-producao-diaria
        parameters:
          modo: dia
