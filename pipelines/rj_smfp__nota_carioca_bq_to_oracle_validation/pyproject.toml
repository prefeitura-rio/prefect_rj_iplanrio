[project]
name = "rj_smfp__nota_carioca_bq_to_oracle_validation"
version = "1.0.0"
description = "Inspects the Oracle tables loaded by rj_smfp__nota_carioca_bq_to_oracle and compares schema, types, row counts and per-column aggregates with BigQuery, writing a shareable report to the Prefect logs."
dependencies = [
    "prefect_rj_iplanrio",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-storage>=2.10.0",
    "oracledb>=4.0.1",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
