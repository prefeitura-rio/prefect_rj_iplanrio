name: rj_smfp__nota_carioca_oracle_to_bq
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_smfp__nota_carioca_oracle_to_bq-{{ get-commit-hash.stdout }}"
    dockerfile: pipelines/rj_smfp__nota_carioca_oracle_to_bq/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{{ build-image.image_name }}"
    tag: "{{ build-image.tag }}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
- name: rj-smfp--nota-carioca-oracle-to-bq--staging
  tags:
  - environment:staging
  - severity:low
  - code_owner:fredzolio
  version: "{{ build-image.tag }}"
  entrypoint: pipelines/rj_smfp__nota_carioca_oracle_to_bq/flow.py:rj_smfp__nota_carioca_oracle_to_bq
  # 1 pai + 3 filhos (um pod por tabela). A exclusão entre cargas é feita no código: o pai recusa a execução se
  # houver outro pai (ou filho) ativo, sem limite global de concorrência, que prenderia o slot se um pod morresse.
  concurrency_limit:
    limit: 4
    collision_strategy: ENQUEUE
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_smfp__nota_carioca_oracle_to_bq -- prefect flow-run execute
      secretName: prefect-jobs-secrets-staging
      image_pull_policy: Always
- name: rj-smfp--nota-carioca-oracle-to-bq--prod
  tags:
  - environment:prod
  - severity:medium
  - code_owner:fredzolio
  version: "{{ get-commit-hash.stdout }}"
  entrypoint: pipelines/rj_smfp__nota_carioca_oracle_to_bq/flow.py:rj_smfp__nota_carioca_oracle_to_bq
  # 1 pai + 3 filhos (um pod por tabela). A exclusão entre cargas é feita no código: o pai recusa a execução se
  # houver outro pai (ou filho) ativo, sem limite global de concorrência, que prenderia o slot se um pod morresse.
  concurrency_limit:
    limit: 4
    collision_strategy: ENQUEUE
  parameters:
    dataset_id: brutos_nota_fiscal
    # 6 processos de leitura por pod (era 2) e 6 envios simultâneos ao GCS: mais envios contornam as conexões que a
    # saída de rede prende em ~3 MB/s. Memória: 512 MiB do processo principal + 6 x 640 MiB = ~4,4 GiB, dentro do
    # pod_memory_mb, que precisa ficar abaixo do memory_request dos job_variables menos folga (5 GiB - 256 MiB).
    # No Oracle de prod são 3 x 6 sessões de leitura + 3 de contagem; para aliviar o banco, Custom run com workers=4.
    workers: 6
    pod_memory_mb: 4608
    upload_concurrency: 6
    max_pending_files: 6
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_smfp__nota_carioca_oracle_to_bq -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always
      # Cada pod (pai e filhos) reserva o que os 6 workers usam: os nós não têm reserva de sistema e um pod acima do
      # request já derrubou um nó. Os nós são de 8 vCPU / 15,5 GiB; a conversão para Parquet é limitada por CPU.
      cpu_request: "3"
      cpu_limit: "6"
      memory_request: 5Gi
      memory_limit: 6Gi
