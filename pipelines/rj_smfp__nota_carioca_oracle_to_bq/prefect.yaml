name: rj_smfp__nota_carioca_oracle_to_bq
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smfp__nota_carioca_oracle_to_bq-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smfp__nota_carioca_oracle_to_bq/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smfp--nota-carioca-oracle-to-bq--staging
    tags:
      - environment:staging
      - severity:low
      - code_owner:fredzolio
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_smfp__nota_carioca_oracle_to_bq/flow.py:rj_smfp__nota_carioca_oracle_to_bq
    concurrency_limit:
      limit: 4
      collision_strategy: ENQUEUE
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smfp__nota_carioca_oracle_to_bq -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always
    parameters:
      database:
        type: oracle
        host: ${ORACLE_NOTA_FISCAL_HOST}
        port: 1521
        database: ${ORACLE_NOTA_FISCAL_SERVICE}
      cloud:
        bucket: rj-iplanrio-dia-bq-to-oracle
        project: rj-iplanrio-dia
        connection: rj-iplanrio-dia.us.biglake
  - name: rj-smfp--nota-carioca-oracle-to-bq--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:fredzolio
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_smfp__nota_carioca_oracle_to_bq/flow.py:rj_smfp__nota_carioca_oracle_to_bq
    concurrency_limit:
      limit: 4
      collision_strategy: ENQUEUE
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smfp__nota_carioca_oracle_to_bq -- prefect flow-run execute
        secretName: prefect-jobs-secrets
        image_pull_policy: Always
        cpu_request: '3'
        cpu_limit: '6'
        memory_request: 5Gi
        memory_limit: 6Gi
    parameters:
      database:
        type: oracle
        host: ${ORACLE_NOTA_FISCAL_HOST}
        port: 1521
        database: ${ORACLE_NOTA_FISCAL_SERVICE}
      cloud:
        bucket: rj-iplanrio-dia-bq-to-oracle
        project: rj-iplanrio-dia
        connection: rj-iplanrio-dia.us.biglake
    schedules:
      - interval: 86400
        anchor_date: '2026-01-01T01:00:00'
        timezone: America/Sao_Paulo
        slug: dps
        active: false
        parameters:
          table:
            dataset_id: brutos_nota_fiscal
            table_id: DPS
          read:
            table: DFEN.DPS
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-01-01T02:00:00'
        timezone: America/Sao_Paulo
        slug: notas_nacionais
        active: false
        parameters:
          table:
            dataset_id: brutos_nota_fiscal
            table_id: NOTAS_NACIONAIS
          read:
            table: DFEN.NOTAS_NACIONAIS
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-01-01T03:00:00'
        timezone: America/Sao_Paulo
        slug: pessoas_nacionais
        active: false
        parameters:
          table:
            dataset_id: brutos_nota_fiscal
            table_id: PESSOAS_NACIONAIS
          read:
            table: DFEN.PESSOAS_NACIONAIS
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
