name: rj_seconserva__infraestrutura_siscor_obras
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_seconserva__infraestrutura_siscor_obras-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_seconserva__infraestrutura_siscor_obras/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-seconserva--infraestrutura-siscor-obras--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_seconserva__infraestrutura_siscor_obras/flow.py:rj_seconserva__infraestrutura_siscor_obras
    parameters:
      database:
        type: mssql
        host: 10.70.11.61
        port: 1433
        database: siscor_seconserva
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_seconserva__infraestrutura_siscor_obras -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_seconserva__infraestrutura_siscor_obras,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
  - name: rj-seconserva--infraestrutura-siscor-obras--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_seconserva__infraestrutura_siscor_obras/flow.py:rj_seconserva__infraestrutura_siscor_obras
    parameters:
      database:
        type: mssql
        host: 10.70.11.61
        port: 1433
        database: siscor_seconserva
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_seconserva__infraestrutura_siscor_obras -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_seconserva__infraestrutura_siscor_obras,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    schedules:
      - interval: 86400
        anchor_date: '2026-06-08T23:00:00'
        timezone: America/Sao_Paulo
        slug: processo-autorizacao-obra-daily
        parameters:
          table:
            dataset_id: infraestrutura_siscor_obras
            table_id: processo_autorizacao_obra
          read:
            query: |
              SELECT
                              distinct '26' as Secretaria,
                              STR(po.nmr_processo, 6, 0) + '/' + po.ano_processo as Processo,
                              po.sqnc_processo,
                              case po.sqncl_tp_processo when 0 then tpr.tp_processo
                                  else STR(po.sqncl_tp_processo,1)
                                  + '° ' + tpr.tp_processo
                                  END AS dscr_tp_processo,
                              po.dt_protocolo,
                              po.dt_inicio_obra,
                              po.dt_fim_obra,
                              po.area_ocupacao,
                              po.observacao,
                              po.prz_execucao,
                              po.dt_aprovacao,
                              nat.natureza_obra,
                              tpo.tp_obra,
                              lco.lcl_obra,
                              vpfj.cpfcgc as 'Cgc_Requerente',
                              vpfj.nome as requerente,
                              lo.cdg_logradouro,
                              lo.nm_lgrdr,
                              po.dt_plenario,
                              tps.dscr_situacao,
                              tpp.dscr_parecer,
                              po.nmr_licenca,
                              pj.cgc as 'cgc_executor',
                              pj.nm_fantasia as executor
                          FROM PROCESSO_OCOR po
                          INNER JOIN     NATUREZA_OBRA     nat ON
                              po.cdg_natureza = nat.cdg_natureza
                          INNER JOIN     TIPO_OBRA tpo         ON
                              po.cdg_tp_obra = tpo.cdg_tp_obra
                          INNER JOIN     TIPO_PROCESSO tpr    ON
                              po.cdg_tp_processo = tpr.cdg_tp_processo
                          INNER JOIN     TIPO_PARECER tpp    ON
                              po.cdg_parecer = tpp.cdg_parecer
                          INNER JOIN     TIPO_SITUACAO tps    ON
                              po.cdg_situacao = tps.cdg_situacao
                          INNER JOIN     LOCAL_OBRA lco        ON
                              po.cdg_lcl_obra = lco.cdg_lcl_obra
                          INNER join V_LOCALIZACAO lo on
                              lo.nmr_processo = po.nmr_processo
                              and lo.ano_processo = po.ano_processo
                              left join requerente rp on
                              rp.nmr_processo = po.nmr_processo
                              and rp.ano_processo = po.ano_processo
                              left join executor ex
                              on ex.nmr_processo = po.nmr_processo
                              and ex.ano_processo = po.ano_processo
                              left join pessoa_juridica pj
                              on pj.sqnc_pessoa = ex.sqnc_pessoa_executor
                              left join v_ps_FscJrdc vpfj
                              on vpfj.sqnc_pessoa = rp.sqnc_pessoa_requerente
                          union
                          SELECT
                              distinct '06' as Secretaria,
                              STR(po.nmr_processo, 6, 0) + '/' + po.ano_processo as Processo,
                              po.sqnc_processo,
                              case po.sqncl_tp_processo when 0 then tpr.tp_processo
                                  else STR(po.sqncl_tp_processo,1)
                                  + '° ' + tpr.tp_processo
                                  END AS dscr_tp_processo,
                              po.dt_protocolo,
                              po.dt_inicio_obra,
                              po.dt_fim_obra,
                              po.area_ocupacao,
                              po.observacao,
                              po.prz_execucao,
                              po.dt_aprovacao,
                              nat.natureza_obra,
                              tpo.tp_obra,
                              lco.lcl_obra,
                              vpfj.cpfcgc as 'Cgc_Requerente',
                              vpfj.nome as requerente,
                              lo.cdg_logradouro,
                              lo.nm_lgrdr,
                              po.dt_plenario,
                              tps.dscr_situacao,
                              tpp.dscr_parecer,
                              po.nmr_licenca,
                              pj.cgc as 'cgc_executor',
                              pj.nm_fantasia as executor
                          FROM siscor.dbo.PROCESSO_OCOR po
                          INNER JOIN     siscor.dbo.NATUREZA_OBRA     nat ON
                              po.cdg_natureza = nat.cdg_natureza
                          INNER JOIN     siscor.dbo.TIPO_OBRA tpo         ON
                              po.cdg_tp_obra = tpo.cdg_tp_obra
                          INNER JOIN     siscor.dbo.TIPO_PROCESSO tpr    ON
                              po.cdg_tp_processo = tpr.cdg_tp_processo
                          INNER JOIN     siscor.dbo.TIPO_PARECER tpp    ON
                              po.cdg_parecer = tpp.cdg_parecer
                          INNER JOIN     siscor.dbo.TIPO_SITUACAO tps    ON
                              po.cdg_situacao = tps.cdg_situacao
                          INNER JOIN     siscor.dbo.LOCAL_OBRA lco        ON
                              po.cdg_lcl_obra = lco.cdg_lcl_obra
                              INNER join siscor.dbo.V_LOCALIZACAO lo on
                              lo.nmr_processo = po.nmr_processo
                              and lo.ano_processo = po.ano_processo
                              left join siscor.dbo.requerente rp on
                              rp.nmr_processo = po.nmr_processo
                              and rp.ano_processo = po.ano_processo
                              left join siscor.dbo.executor ex
                              on ex.nmr_processo = po.nmr_processo
                              and ex.ano_processo = po.ano_processo
                              left join siscor.dbo.pessoa_juridica pj
                              on pj.sqnc_pessoa = ex.sqnc_pessoa_executor
                              left join siscor.dbo.v_ps_FscJrdc vpfj
                              on vpfj.sqnc_pessoa = rp.sqnc_pessoa_requerente
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
