name: rj_crm__whitelist_whatsapp_relatorio
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_crm__whitelist_whatsapp_relatorio-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_crm__whitelist_whatsapp_relatorio/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-crm--whitelist-whatsapp-relatorio--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:jmaurodev
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_crm__whitelist_whatsapp_relatorio/flow.py:rj_crm__whitelist_whatsapp_relatorio
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_crm__whitelist_whatsapp_relatorio -- prefect flow-run execute
        secretName: prefect-jobs-crm-registry-secrets-staging
        image_pull_policy: Always
        env:
          # Sem isto o Prefect ignora os loggers da pipeline e só WARNING+ aparece.
          PREFECT_LOGGING_EXTRA_LOGGERS: pipelines.rj_crm__whitelist_whatsapp_relatorio
    parameters:
      environment: staging
      query_ocorrencias:
        name: get_redacted_urls
        replacements:
          project: rj-crm-registry
          dataset_id: brutos_salesforce
          table_id: ai_agent_interaction_step
      query_ultima_ocorrencia:
        name: get_ultima_ocorrencia
        replacements:
          project: rj-crm-registry
          dataset_id: brutos_salesforce
          table_id: ai_agent_interaction_step

  - name: rj-crm--whitelist-whatsapp-relatorio--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:jmaurodev
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_crm__whitelist_whatsapp_relatorio/flow.py:rj_crm__whitelist_whatsapp_relatorio
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_crm__whitelist_whatsapp_relatorio -- prefect flow-run execute
        secretName: prefect-jobs-crm-registry-secrets
        image_pull_policy: Always
        env:
          # Sem isto o Prefect ignora os loggers da pipeline e só WARNING+ aparece.
          PREFECT_LOGGING_EXTRA_LOGGERS: pipelines.rj_crm__whitelist_whatsapp_relatorio
    parameters:
      environment: prod
      query_ocorrencias:
        name: get_redacted_urls
        replacements:
          project: rj-crm-registry
          dataset_id: brutos_salesforce
          table_id: ai_agent_interaction_step
      query_ultima_ocorrencia:
        name: get_ultima_ocorrencia
        replacements:
          project: rj-crm-registry
          dataset_id: brutos_salesforce
          table_id: ai_agent_interaction_step
    schedules:
      - cron: "0 9 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: diario-09h
