name: rj_smi__siscob
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smi__siscob-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smi__siscob/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smi--siscob--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_smi__siscob/flow.py:rj_smi__siscob
    parameters:
      database:
        type: mssql
        host: 10.70.1.34
        port: 1433
        database: SISCOB200
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smi__siscob -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-rj-smi--siscob
        image_pull_policy: Always
  - name: rj-smi--siscob--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_smi__siscob/flow.py:rj_smi__siscob
    parameters:
      database:
        type: mssql
        host: 10.70.1.34
        port: 1433
        database: SISCOB200
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smi__siscob -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-rj-smi--siscob
        image_pull_policy: Always
    schedules:
      - interval: 86400
        anchor_date: '2025-07-15T21:05:00'
        timezone: America/Sao_Paulo
        slug: obra
        parameters:
          table:
            dataset_id: brutos_siscob
            table_id: obra
          read:
            query: SELECT DISTINCT CD_OBRA, REPLACE(REPLACE(DS_TITULO, CHAR(13), ''), CHAR(10), '') AS DS_TITULO, ORGAO_CONTRATANTE, ORGAO_EXECUTOR, NR_PROCESSO, OBJETO, NM_FAVORECIDO, CNPJ, NR_LICITACAO, MODALIDADE, DT_ASS_CONTRATO, DT_INICIO_OBRA, DT_TERMINO_PREVISTO, DT_TERMINO_ATUAL, NR_CONTRATO, AA_EXERCICIO, SITUACAO, VL_ORCADO_C_BDI, VL_CONTRATADO, VL_VIGENTE, PC_MEDIDO, PRAZO_INICIAL FROM dbo.fuSEGOVI_Dados_da_Obra()
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2025-07-15T21:10:00'
        timezone: America/Sao_Paulo
        slug: medicao
