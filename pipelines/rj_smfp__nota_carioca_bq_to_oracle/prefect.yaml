name: rj_smfp__nota_carioca_bq_to_oracle
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_smfp__nota_carioca_bq_to_oracle-{{ get-commit-hash.stdout }}"
    dockerfile: pipelines/rj_smfp__nota_carioca_bq_to_oracle/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{{ build-image.image_name }}"
    tag: "{{ build-image.tag }}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
- name: rj-smfp--nota-carioca-bq-to-oracle--staging
  tags:
  - environment:staging
  - severity:low
  - code_owner:fredzolio
  version: "{{ build-image.tag }}"
  entrypoint: pipelines/rj_smfp__nota_carioca_bq_to_oracle/flow.py:rj_smfp__nota_carioca_bq_to_oracle
  concurrency_limit:
    limit: 1
    collision_strategy: ENQUEUE
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_smfp__nota_carioca_bq_to_oracle -- prefect flow-run execute
      secretName: prefect-jobs-secrets-staging
      image_pull_policy: Always
- name: rj-smfp--nota-carioca-bq-to-oracle--prod
  tags:
  - environment:prod
  - severity:medium
  - code_owner:fredzolio
  version: "{{ get-commit-hash.stdout }}"
  entrypoint: pipelines/rj_smfp__nota_carioca_bq_to_oracle/flow.py:rj_smfp__nota_carioca_bq_to_oracle
  concurrency_limit:
    limit: 1
    collision_strategy: ENQUEUE
  parameters:
    dataset_id: nota_carioca
    run_dbt: true
    table_ids:
    - MVT_NOTAS_NACIONAIS_EXIGIVEIS
    - MVT_NOTAS_NACIONAIS_EXIGIVEIS_DETALHES
    - MVT_NOTAS_NACIONAIS_DETALHES
    dbt_parameters:
      command: build
      select: >-
        mart_nota_carioca__notas_nacionais_exigiveis
        mart_nota_carioca__notas_nacionais_exigiveis_detalhes
        mart_nota_carioca__notas_nacionais_detalhes
      send_discord_report: false
      github_repo: https://github.com/prefeitura-rio/queries-rj-iplanrio.git
      bigquery_project: rj-iplanrio
      target: prod
      gcs_buckets:
        prod: rj-iplanrio_dbt
        dev: rj-iplanrio-dev_dbt
    sqlldr_sessions: 4
    index_parallel_degree: 8
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_smfp__nota_carioca_bq_to_oracle -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always
      cpu_request: "4"
      cpu_limit: "6"
      memory_request: 4Gi
      memory_limit: 6Gi
  schedules:
  - cron: "0 9,18 * * *"
    timezone: America/Sao_Paulo
    active: false
    slug: nota-carioca-bq-to-oracle-9h-18h
