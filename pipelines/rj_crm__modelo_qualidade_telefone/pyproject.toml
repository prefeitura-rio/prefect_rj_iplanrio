[project]
name = "rj_crm__modelo_qualidade_telefone"
version = "1.0.0"
description = "Estima a probabilidade de cada telefone ser HighDelivery no WhatsApp (LightGBM) e retreina o modelo todo mês, para o CRM escolher telefones com menos falha de entrega."
dependencies = [
    "prefect_rj_iplanrio",
    "db-dtypes>=1.3.0",
    "google-api-python-client",
    "google-cloud-bigquery[bqstorage]",
    "google-cloud-storage",
    "lightgbm>=4.5.0",
    "matplotlib>=3.8.0",
    "numpy",
    "optuna>=3.6.0",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "shap>=0.46.0",
    "statsmodels>=0.14.0",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
