[project]
name = "rj_crm__modelo_qualidade_telefone"
version = "1.0.0"
description = "Estima a probabilidade de cada telefone ser HighDelivery no WhatsApp (LightGBM) e retreina o modelo todo mês, para o CRM escolher telefones com menos falha de entrega."
dependencies = [
    "prefect_rj_iplanrio",
    "db-dtypes>=1.3.0",
    "google-api-python-client>=2.100.0",
    "google-cloud-bigquery[bqstorage]>=3.25.0",
    # >=2.10.0, não >=2.18.0: várias pipelines do workspace fixam ==2.10.0 exato
    # (rj_crm__api_wetalkie e outras), e o uv.lock é um só pro repo inteiro — a API que
    # usamos (storage.Client, bucket/blob, upload/download) já existe nessa versão.
    "google-cloud-storage>=2.10.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.8.0",
    "numpy>=2.0",
    "optuna>=3.6.0",
    "pandas>=2.2.3",
    "prefect==3.4.9",
    "prefect-docker>=0.6.5",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "shap>=0.46.0",
    "statsmodels>=0.14.0",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
