name: rj_crm__modelo_qualidade_telefone
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__modelo_qualidade_telefone-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__modelo_qualidade_telefone/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-crm--modelo-qualidade-telefone--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:MariaLuizaCw
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_crm__modelo_qualidade_telefone/flow.py:rj_crm__modelo_qualidade_telefone
    parameters:
      mode: score
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: "uv run --package rj_crm__modelo_qualidade_telefone -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets-staging
        image_pull_policy: Always

  - name: rj-crm--modelo-qualidade-telefone--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:MariaLuizaCw
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_crm__modelo_qualidade_telefone/flow.py:rj_crm__modelo_qualidade_telefone
    parameters:
      mode: score
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: "uv run --package rj_crm__modelo_qualidade_telefone -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets
        image_pull_policy: Always
    schedules:
      - interval: 259200
        anchor_date: "2026-09-24T06:00:00"
        timezone: America/Sao_Paulo
        active: true
        slug: qualidade-telefone-score-3dias
        parameters:
          modo: score
      - cron: "0 3 1 * *"
        timezone: America/Sao_Paulo
        active: true
        slug: qualidade-telefone-retreino-mensal
        parameters:
          modo: retreino
