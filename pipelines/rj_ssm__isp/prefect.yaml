name: rj_ssm__isp
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_ssm__isp-{{ get-commit-hash.stdout }}"
    dockerfile: pipelines/rj_ssm__isp/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{{ build-image.image_name }}"
    tag: "{{ build-image.tag }}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
- name: rj-ssm--isp--staging
  tags:
  - environment:staging
  - severity:high
  - code_owner:tricktx
  version: "{{ build-image.tag }}"
  entrypoint: pipelines/rj_ssm__isp/flow.py:rj_ssm__isp
  work_pool:
    name: k3s-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_ssm__isp -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always
- name: rj-ssm--isp--prod
  tags:
  - environment:prod
  - severity:high
  - code_owner:tricktx
  version: "{{ get-commit-hash.stdout }}"
  entrypoint: pipelines/rj_ssm__isp/flow.py:rj_ssm__isp
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_ssm__isp -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always

  schedules:
  # Fase 1 (Parcial): roda diariamente às 15h.
  # Janela: dia anterior (D-1), calculada pelo flow.
  - cron: "0 15 * * *"
    timezone: America/Sao_Paulo
    slug: ocorrencias-parcial
    parameters:
      table_id: ocorrencias
      dump_mode: append
      fase: parcial
  # Fase 2 (Consolidados): roda 3x ao mês (dias 1, 15 e 30) às 16h.
  # Janela: mês anterior completo (1º ao último dia do mês anterior), calculada pelo flow.
  - cron: "0 16 1,15,30 * *"
    timezone: America/Sao_Paulo
    slug: ocorrencias-consolidados
    parameters:
      table_id: ocorrencias
      dump_mode: append
      fase: consolidados
  # Fase 3 (Errata): roda 3x ao mês (dias 1, 15 e 30) às 17h.
  # Janela: último trimestre completo (Jan–Mar, Abr–Jun, Jul–Set, Out–Dez), calculada pelo flow.
  - cron: "0 17 1,15,30 * *"
    timezone: America/Sao_Paulo
    slug: ocorrencias-errata
    parameters:
      table_id: ocorrencias
      dump_mode: append
      fase: errata
