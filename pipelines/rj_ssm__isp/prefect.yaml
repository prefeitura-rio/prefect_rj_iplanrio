name: rj_ssm__isp
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_ssm__isp-{{ get-commit-hash.stdout }}"
    dockerfile: pipelines/rj_ssm__isp/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{{ build-image.image_name }}"
    tag: "{{ build-image.tag }}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
- name: rj-ssm--isp--staging
  tags:
  - environment:staging
  - severity:high
  - code_owner:tricktx
  version: "{{ build-image.tag }}"
  entrypoint: pipelines/rj_ssm__isp/flow.py:rj_ssm__isp
  work_pool:
    name: k3s-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_ssm__isp -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always
- name: rj-ssm--isp--prod
  tags:
  - environment:prod
  - severity:high
  - code_owner:tricktx
  version: "{{ get-commit-hash.stdout }}"
  entrypoint: pipelines/rj_ssm__isp/flow.py:rj_ssm__isp
  work_pool:
    name: k3s-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_ssm__isp -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always

  schedules:
  # Fase 1 (Parcial): Roda todos os dias às 15h, para atualizar a tabela com os dados do dia anterior.
  # Janela padrão: D-1 até D-1, calculada pelo flow. A fase "parcial" é usada para atualizar a tabela com os dados do dia anterior.
  - cron: "0 15 * * *"
    timezone: America/Sao_Paulo
    slug: ocorrencias-parcial
    parameters:
      table_id: ocorrencias
      dump_mode: append
      fase: parcial
  # Fase 2 (Consolidados): roda mensalmente no dia 1 de cada mês.
  # Janela padrão: últimos 30 dias (D-30 até D-1), calculada pelo flow.
  - cron: "0 6 1 * *"
    timezone: America/Sao_Paulo
    slug: ocorrencias-consolidados
    parameters:
      table_id: ocorrencias
      dump_mode: append
      fase: consolidados
  # Fase 3 (Errata): roda 1x ao mês, apenas no início de cada trimestre
  # (março, junho, setembro, dezembro). Janela padrão: último trimestre completo.
  - cron: "0 5 1 3,6,9,12 *"
    timezone: America/Sao_Paulo
    slug: ocorrencias-errata
    parameters:
      table_id: ocorrencias
      dump_mode: append
      fase: errata
