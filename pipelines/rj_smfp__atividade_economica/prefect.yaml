name: rj_smfp__atividade_economica
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smfp__atividade_economica-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smfp__atividade_economica/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smfp--atividade-economica--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_smfp__atividade_economica/flow.py:rj_smfp__atividade_economica
    parameters:
      database:
        type: mssql
        host: 10.70.15.11
        port: 1433
        database: DW_BI_ALVARAS
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smfp__atividade_economica -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_smfp__atividade_economica,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
  - name: rj-smfp--atividade-economica--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_smfp__atividade_economica/flow.py:rj_smfp__atividade_economica
    parameters:
      database:
        type: mssql
        host: 10.70.15.11
        port: 1433
        database: DW_BI_ALVARAS
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smfp__atividade_economica -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_smfp__atividade_economica,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    schedules:
      - interval: 86400
        anchor_date: '2026-01-01T01:00:00'
        timezone: America/Sao_Paulo
        slug: fact_fatoalvaras
        active: false
        parameters:
          table:
            dataset_id: atividade_economica
            table_id: fact_fatoalvaras
          read:
            query: |
              SELECT
                              ID_Alvara,
                              Quantidade,
                              ID_AtvProcesso,
                              ID_CAE,
                              ID_CNAE,
                              ID_DiaDeferimento,
                              ID_DiaSolicitacao,
                              ID_DiaTaxaPagamen,
                              ID_Direcionamento,
                              ID_TipoContribuint,
                              ID_TipoSolicitacao
                          FROM DW_BI_ALVARAS.dbo.FACT_FatoAlvaras;
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-01-01T01:00:00'
