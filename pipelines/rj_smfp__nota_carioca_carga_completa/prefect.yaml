name: rj_smfp__nota_carioca_carga_completa
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_smfp__nota_carioca_carga_completa-{{ get-commit-hash.stdout }}"
    dockerfile: pipelines/rj_smfp__nota_carioca_carga_completa/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{{ build-image.image_name }}"
    tag: "{{ build-image.tag }}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
# Staging: encadeia os deployments de staging (extração XML na homologação, datasets *_staging e Oracle de homologação)
# com os mesmos tempos limite e a mesma pausa da prod. O Discord posta no canal de staging, com o marcador 🧪 STAGING (o ambiente vem do nome do
# deployment, terminado em --staging).
- name: rj-smfp--nota-carioca-carga-completa--staging
  tags:
  - environment:staging
  - severity:low
  - code_owner:fredzolio
  version: "{{ build-image.tag }}"
  entrypoint: pipelines/rj_smfp__nota_carioca_carga_completa/flow.py:rj_smfp__nota_carioca_carga_completa
  # Uma carga completa por vez, como em prod.
  concurrency_limit:
    limit: 1
    collision_strategy: CANCEL_NEW
  # Sem schedule: o disparo é manual ou pelo bot do Discord.
  parameters:
    extracao_xml_deployment: rj-smfp--nota-carioca-extracao-xml/rj-smfp--nota-carioca-extracao-xml--staging
    oracle_to_bq_deployment: rj-smfp--nota-carioca-oracle-to-bq/rj-smfp--nota-carioca-oracle-to-bq--staging
    bq_to_oracle_deployment: rj-smfp--nota-carioca-bq-to-oracle/rj-smfp--nota-carioca-bq-to-oracle--staging
    # Cargos mencionados nas paradas (ids do Discord), os mesmos da prod: nota-carioca e infra.
    discord_alert_role_ids:
    - "1558828140166647901"
    - "903644455582695494"
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_smfp__nota_carioca_carga_completa -- prefect flow-run execute
      secretName: prefect-jobs-secrets-staging
      image_pull_policy: Always
      # O pod só espera os filhos (consulta a API do Prefect); a carga roda nos pods deles.
      # Requests iguais aos limits (QoS Guaranteed): é o último pod a ser despejado quando o nó fica sem memória.
      cpu_request: "250m"
      cpu_limit: "250m"
      memory_request: 512Mi
      memory_limit: 512Mi
# Prod: encadeia os deployments de prod (os padrões dos parâmetros do flow: extração XML, Oracle → BigQuery e
# BigQuery → Oracle) e opera sobre dados reais.
- name: rj-smfp--nota-carioca-carga-completa--prod
  tags:
  - environment:prod
  - severity:medium
  - code_owner:fredzolio
  version: "{{ get-commit-hash.stdout }}"
  entrypoint: pipelines/rj_smfp__nota_carioca_carga_completa/flow.py:rj_smfp__nota_carioca_carga_completa
  # Uma carga completa por vez. A exclusão contra disparos manuais dos deployments encadeados é feita no código
  # (trava antes de cada disparo), e cada um deles também recusa rodar em paralelo.
  concurrency_limit:
    limit: 1
    collision_strategy: CANCEL_NEW
  # Todo dia às 17h (horário do Rio), e também manual ou pelo bot do Discord (tags disparo:discord e
  # discord-user:<id>). O limite de concorrência descarta um disparo enquanto outra carga completa estiver rodando.
  schedules:
  - cron: "0 17 * * *"
    timezone: America/Sao_Paulo
    active: true
  parameters:
    # Cargos mencionados nas paradas (ids do Discord): nota-carioca e infra.
    discord_alert_role_ids:
    - "1558828140166647901"
    - "903644455582695494"
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_smfp__nota_carioca_carga_completa -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always
      # O pod só espera os filhos (consulta a API do Prefect); a carga roda nos pods deles.
      # Requests iguais aos limits (QoS Guaranteed): é o último pod a ser despejado quando o nó fica sem memória.
      cpu_request: "250m"
      cpu_limit: "250m"
      memory_request: 512Mi
      memory_limit: 512Mi
