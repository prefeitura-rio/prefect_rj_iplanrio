name: rj_iplanrio__czrm_salesforce_datacloud
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_iplanrio__czrm_salesforce_datacloud-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_iplanrio__czrm_salesforce_datacloud/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-iplanrio--czrm-salesforce-datacloud--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:brunomesquitac
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_iplanrio__czrm_salesforce_datacloud/flow.py:rj_iplanrio__czrm_salesforce_datacloud
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_iplanrio__czrm_salesforce_datacloud -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_iplanrio__czrm_salesforce_datacloud,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    parameters:
      origem: staging
      dry_run: true

  - name: rj-iplanrio--czrm-salesforce-datacloud--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:brunomesquitac
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_iplanrio__czrm_salesforce_datacloud/flow.py:rj_iplanrio__czrm_salesforce_datacloud
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_iplanrio__czrm_salesforce_datacloud -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_iplanrio__czrm_salesforce_datacloud,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
    parameters:
      origem: prod
      project_id: rj-iplanrio
      dataset_id: brutos_czrm_salesforce_staging
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    schedules:
      - cron: "*/15 * * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: czrm-salesforce-15min
        parameters:
          modo: hora
      - cron: "15 0 * * *"
        timezone: America/Sao_Paulo
        active: false
        slug: czrm-salesforce-diario
        parameters:
          modo: dia
      - cron: "0 3 * * 0"
        timezone: America/Sao_Paulo
        active: false
        slug: czrm-salesforce-semanal
        parameters:
          modo: reconciliacao
