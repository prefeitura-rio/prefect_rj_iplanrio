[project]
name = "rj_rmi__run_dbt"
version = "1.0.0"
description = """\
    Roda o dbt do queries-rj-rmi para construir o Registro Municipal \
    Integrado no BigQuery rj-rmi, com a service account do RMI e separado do \
    CRM: a passada diária (tag:daily) e comandos avulsos pela UI do Prefect."""
dependencies = [
    "prefect_rj_iplanrio",
    "dbt-bigquery",
    "gitpython",
    "prefect-dbt",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
