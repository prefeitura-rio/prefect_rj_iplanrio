name: rj_iplanrio__taxirio
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_iplanrio__taxirio-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_iplanrio__taxirio/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-iplanrio--taxirio--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_iplanrio__taxirio/flow.py:rj_iplanrio__taxirio
    work_pool:
      name: taxirio-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_iplanrio__taxirio -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always
    parameters:
      cloud:
        bucket: rj-iplanrio
        project: rj-iplanrio
        connection: rj-iplanrio.us.biglake
  - name: rj-iplanrio--taxirio--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_iplanrio__taxirio/flow.py:rj_iplanrio__taxirio
    work_pool:
      name: taxirio-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_iplanrio__taxirio -- prefect flow-run execute
        secretName: prefect-jobs-secrets
        image_pull_policy: Always
    parameters:
      cloud:
        bucket: rj-iplanrio
        project: rj-iplanrio
        connection: rj-iplanrio.us.biglake
    schedules:
      - interval: 604800
        anchor_date: '2024-09-01T07:00:00'
        timezone: America/Sao_Paulo
        slug: cities-weekly
        parameters:
          database:
            type: mongodb
            host: TAXIRIO_MONGODB_HOST
            port: 27017
            database: taxirio
            options:
              shape: pipelines.rj_iplanrio__taxirio.helpers:CITIES
          table:
            dataset_id: brutos_taxirio
            table_id: cities
          read:
            table: cities
            pipeline:
              - '{"$project": {"id": {"$toString": "$_id"}, "name": 1, "stateAbbreviation": 1, "isCalulatedInApp": {"$toString": "$isCalulatedInApp"}, "isAbleToUsePaymentInApp": {"$toString": "$isAbleToUsePaymentInApp"}, "loginLabel": 1, "serviceStations": {"$function": {"lang": "js", "args": ["$serviceStations"], "body": "function(x) { return JSON.stringify(x); }"}}}}'
              - '{"$unset": "_id"}'
          dump_mode: overwrite
      - interval: 604800
        anchor_date: '2024-09-01T07:05:00'
        timezone: America/Sao_Paulo
        slug: drivers-weekly
        parameters:
          database:
