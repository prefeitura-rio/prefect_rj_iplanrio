            database: taxirio
            options:
              shape: pipelines.rj_iplanrio__taxirio.helpers:DRIVERS
          table:
            dataset_id: brutos_taxirio
            table_id: drivers
          read:
            table: drivers
            pipeline:
              - '{"$project": {"id": {"$toString": "$_id"}, "user": {"$toString": "$user"}, "taxiDriverId": 1, "cars": {"$map": {"input": "$cars", "as": "car", "in": {"$toString": "$$car"}}}, "average": {"$toString": "$average"}, "associatedCar": {"$toString": "$associatedCar"}, "createdAt": {"$dateToString": {"date": "$createdAt"}}, "ano_particao": {"$dateToString": {"format": "%Y", "date": "$createdAt"}}, "mes_particao": {"$dateToString": {"format": "%m", "date": "$createdAt"}}, "dia_particao": {"$dateToString": {"format": "%d", "date": "$createdAt"}}, "status": 1, "associatedDiscount": {"$toString": "$associatedDiscount"}, "associatedPaymentsMethods": {"$map": {"input": "$associatedPaymentsMethods", "as": "paymentMethod", "in": {"$toString": "$$paymentMethod"}}}, "login": 1, "password": 1, "salt": 1, "isAbleToReceivePaymentInApp": {"$toString": "$isAbleToReceivePaymentInApp"}, "isAbleToReceivePaymentInCityHall": {"$toString": "$isAbleToReceivePaymentInCityHall"}, "ratingsReceived": {"$toString": "$ratingsReceived"}, "busy": {"$toString": "$busy"}, "associatedRace_originAtAccepted_position_lng": {"$toString": "$associatedRace.originAtAccepted.position.lng"}, "associatedRace_originAtAccepted_position_lat": {"$toString": "$associatedRace.originAtAccepted.position.lat"}, "associatedRace_race": {"$toString": "$associatedRace.race"}, "lastAverage": {"$toString": "$lastAverage"}, "expiredBlockByRankingDate": {"$toString": "$expiredBlockByRankingDate"}, "blockedRace": {"$toString": "$blockedRace"}, "infoPhone_updatedAt": {"$dateToString": {"date": "$infoPhone.updatedAt"}}, "infoPhone_id": {"$toString": "$infoPhone._id"}, "infoPhone_appVersion": "$infoPhone.appVersion", "infoPhone_phoneModel": "$infoPhone.phoneModel", "infoPhone_phoneManufacturer": "$infoPhone.phoneManufacturer", "infoPhone_osVersion": "$infoPhone.osVersion", "infoPhone_osName": "$infoPhone.osName", "tokenInfo_httpSalt": "$tokenInfo.httpSalt", "tokenInfo_wssSalt": "$tokenInfo.wssSalt", "tokenInfo_pushToken": "$tokenInfo.pushToken", "city": {"$toString": "$city"}, "serviceRecordRate": {"$toString": "$serviceRecordRate"}, "nota": {"$toString": "$nota"}, "averageTT": {"$toString": "$averageTT"}}}'
              - '{"$unset": "_id"}'
              - '{"$addFields": {"cars": {"$function": {"lang": "js", "args": ["$cars"], "body": "function(x) { return JSON.stringify(x); }"}}, "associatedPaymentsMethods": {"$function": {"lang": "js", "args": ["$associatedPaymentsMethods"], "body": "function(x) { return JSON.stringify(x); }"}}}}'
