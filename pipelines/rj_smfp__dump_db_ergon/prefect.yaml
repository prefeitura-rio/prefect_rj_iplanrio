name: rj_smfp__dump_db_ergon
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_smfp__dump_db_ergon-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_smfp__dump_db_ergon/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-smfp--dump-db-ergon--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_smfp__dump_db_ergon/flow.py:rj_smfp__dump_db_ergon
    parameters:
      database:
        type: oracle
        host: 10.70.6.21
        port: 1526
        database: P01.PCRJ
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --package rj_smfp__dump_db_ergon -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always
    schedules:
      - interval: 86400
        anchor_date: '2025-07-15T01:00:00'
        timezone: America/Sao_Paulo
        slug: IPL_PT_FICHAS
        active: false
        parameters:
          table:
            dataset_id: brutos_ergon
            table_id: IPL_PT_FICHAS
          read:
            query: |
              SELECT
                          MES_ANO_FOLHA,NUM_FOLHA,NUMFUNC,NUMVINC,NUMPENS,SETOR,SECRETARIA,TIPO_FUNC,
                          ATI_INAT_PENS,DETALHA,RUBRICA,TIPO_RUBRICA,MES_ANO_DIREITO,DESC_VANT,VALOR,COMPLEMENTO,
                          TIPO_CLASSIF,CLASSIFICACAO,TIPO_CLASSIF_FR,CLASSIF_FR,ELEMDESP,TIPORUB,EMP_CODIGO
                      FROM ERGON.IPL_PT_FICHAS
          dump_mode: append
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2025-07-15T01:00:00'
        timezone: America/Sao_Paulo
        slug: FICHAS_FINANCEIRAS
        active: false
        parameters:
          table:
            dataset_id: brutos_ergon
            table_id: FICHAS_FINANCEIRAS
          read:
            query: |
              SELECT
                              MES_ANO_FOLHA,NUM_FOLHA,LANCAMENTO,NUMFUNC,NUMVINC,NUMPENS,MES_ANO_DIREITO,
                              RUBRICA,TIPO_RUBRICA,DESC_VANT,COMPLEMENTO,VALOR,CORRECAO,EXECUCAO,EMP_CODIGO
                          FROM ERGON.FICHAS_FINANCEIRAS
          dump_mode: append
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2025-07-15T01:00:00'
        timezone: America/Sao_Paulo
        slug: VW_DLK_ERG_FITA_BANCO
        active: false
        parameters:
          table:
            dataset_id: brutos_ergon
            table_id: VW_DLK_ERG_FITA_BANCO
          read:
            query: |
              SELECT
                              LANCAMENTO, NUMFUNC, NUMVINC, MES_ANO, NUMERO, RUBRICA, SETOR,
                              VALORVAN, VALORDES, NUMPENS, NUMDEPEN, AGENCIA, BANCO, CONTA, VALORLIQ, TIPOPAG,
                              CARGO, REFERENCIA, CENTRO_CUSTO, FUNCAO, NOME, SINDICATO, LOTE, EMP_CODIGO, FICHA,
                              REGIMEJUR, TIPOVINC, DTEXERC, DTAPOSENT, DTVAC, CATEGORIA, SUBEMP_CODIGO, DATA_CREDITO,
                              NUMREP, EMP_CODIGO_VINC, JORNADA, SUBCATEGORIA, CPF, SUBEMP_CODIGO_GFIP, FLEX_CAMPO_01,
                              FLEX_CAMPO_02, FLEX_CAMPO_05, NUMJUR, ID_PESSOA, TIPO_PESSOA, SUB_CC, NOME_REP, CPF_REP,
                              TIPOPAG_REP, BANCO_REP, AGENCIA_REP, CONTA_REP
                          FROM C_ERGON.VW_DLK_ERG_FITA_BANCO
          dump_mode: append
          options:
            columns:
              add_timestamp: true
