name: rj_crm__relatorio_engajamento_hsm
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__relatorio_engajamento_hsm-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__relatorio_engajamento_hsm/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-crm--relatorio-engajamento-hsm--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:MariaLuizaCw
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_crm__relatorio_engajamento_hsm/flow.py:rj_crm__relatorio_engajamento_hsm
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_crm__relatorio_engajamento_hsm -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        secretName: pipelines-infisical-dados
        service_account_name: pipelines
        finished_job_ttl: 600
        pod_annotations:
          gke-gcsfuse/volumes: 'true'
        resources:
          requests:
            ephemeral-storage: 1Gi
          limits:
            ephemeral-storage: 4Gi
        volume_mounts:
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: tmp
            csi:
              driver: gcsfuse.csi.storage.gke.io
              volumeAttributes:
                bucketName: rj-iplanrio-dia-pipelines-tmp-gke
                mountOptions: implicit-dirs,file-mode=666,dir-mode=777,enable-buffered-read
        env:
          INFISICAL_URL: https://secrets.dados.rio
          INFISICAL_PROJECT_ID: 5cf5bfc3-e53f-4156-91f6-75714414a316
          INFISICAL_ENVIRONMENT: stg
          INFISICAL_PATHS: /rj_crm__relatorio_engajamento_hsm,/shared
          GCS_TMP_BUCKET: rj-iplanrio-dia-pipelines-tmp-gke

  - name: rj-crm--relatorio-engajamento-hsm--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:MariaLuizaCw
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_crm__relatorio_engajamento_hsm/flow.py:rj_crm__relatorio_engajamento_hsm
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_crm__relatorio_engajamento_hsm -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        secretName: pipelines-infisical-dados
        service_account_name: pipelines
        finished_job_ttl: 600
        pod_annotations:
          gke-gcsfuse/volumes: 'true'
        resources:
          requests:
            ephemeral-storage: 1Gi
          limits:
            ephemeral-storage: 4Gi
        volume_mounts:
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: tmp
            csi:
              driver: gcsfuse.csi.storage.gke.io
              volumeAttributes:
                bucketName: rj-iplanrio-dia-pipelines-tmp-gke
                mountOptions: implicit-dirs,file-mode=666,dir-mode=777,enable-buffered-read
        env:
          INFISICAL_URL: https://secrets.dados.rio
          INFISICAL_PROJECT_ID: 5cf5bfc3-e53f-4156-91f6-75714414a316
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_crm__relatorio_engajamento_hsm,/shared
          GCS_TMP_BUCKET: rj-iplanrio-dia-pipelines-tmp-gke
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    schedules:
      - cron: "0 8 * * *"
        active: false
        timezone: America/Sao_Paulo
        slug: relatorio-engajamento-hsm-8h
      - cron: "0 13 * * *"
        active: false
        timezone: America/Sao_Paulo
        slug: relatorio-engajamento-hsm-13h
      - cron: "0 18 * * *"
        active: false
        timezone: America/Sao_Paulo
        slug: relatorio-engajamento-hsm-18h
