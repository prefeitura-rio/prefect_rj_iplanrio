# Relatório de Engajamento por campanha de WhatsApp -> Google Drive
#
# Entrypoint: flow.py:rj_crm__relatorio_engajamento_hsm (docstring = documentação completa)
#
# Roda 3x/dia, às 8h, 13h e 18h (America/Sao_Paulo): processa as solicitações do Google
# Form "Solicitação de Relatório de Engajamento" (Sheet de respostas em
# config.SOLICITACOES_SHEET_ID) com Data de geração até hoje — material de validação do
# catálogo, relatório de engajamento ou relatório rápido — e grava o status de cada uma
# no próprio Sheet.
#
# Liberar uma campanha acima do teto de conversas: Custom run deste deployment com
#   campanhas_liberadas: ["<campanha>"]
#
# Credenciais no secret do work pool (mesmo secretName de rj_crm__agentforce_classificacao_llm):
#   BF_KEY                        : API key do gateway Bifrost
#   BASEDOSDADOS_CREDENTIALS_PROD : a service account dele precisa de
#       - Editor na pasta "Relatórios de Engajamento" do Drive (config.DRIVE_PASTA_RAIZ_ID)
#       - Editor no Sheet de solicitações (config.SOLICITACOES_SHEET_ID)
#       - leitura em rj-crm-registry.rmi_conversas.chatbot
#       - criar tabela / insert / delete em rj-crm-registry.brutos_salesforce
#         (banco de exemplos do RAG: config.RAG_TABLE, criada pelo flow se não existir)
#
# A imagem leva torch (só-CPU) + o modelo de embedding (~430MB, ver Dockerfile): se o pod
# morrer por falta de memória ao carregar o modelo, configurar memória no job_variables
# conforme o padrão do work pool.

name: rj_crm__relatorio_engajamento_hsm
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__relatorio_engajamento_hsm-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__relatorio_engajamento_hsm/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  # -----------------------------------------------------------------------
  # Deployment de staging (QA) — sem schedule ativo, roda sob demanda até validar
  # (mesmo padrão de rj_crm__agentforce_classificacao_llm).
  # -----------------------------------------------------------------------
  - name: rj-crm--relatorio-engajamento-hsm--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:MariaLuizaCw
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_crm__relatorio_engajamento_hsm/flow.py:rj_crm__relatorio_engajamento_hsm
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: "uv run --package rj_crm__relatorio_engajamento_hsm -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets-staging
        image_pull_policy: Always

  # -----------------------------------------------------------------------
  # Deployment de produção — cron 3x/dia, 8h, 13h e 18h (America/Sao_Paulo)
  # -----------------------------------------------------------------------
  - name: rj-crm--relatorio-engajamento-hsm--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:MariaLuizaCw
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_crm__relatorio_engajamento_hsm/flow.py:rj_crm__relatorio_engajamento_hsm
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: "uv run --package rj_crm__relatorio_engajamento_hsm -- prefect flow-run execute"
        secretName: prefect-jobs-crm-registry-secrets
        image_pull_policy: Always
    schedules:
      - cron: "0 8 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: relatorio-engajamento-hsm-diario-8h
      - cron: "0 13 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: relatorio-engajamento-hsm-diario-13h
      - cron: "0 18 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: relatorio-engajamento-hsm-diario-18h
