name: rj_sme__brutos_gestao_escolar
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_sme__brutos_gestao_escolar-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_sme__brutos_gestao_escolar/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-sme--brutos-gestao-escolar--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_sme__brutos_gestao_escolar/flow.py:rj_sme__brutos_gestao_escolar
    parameters:
      database:
        type: mssql
        host: clustersqlsme2.rio.rj.gov.br
        port: 1433
        database: GestaoEscolar
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_sme__brutos_gestao_escolar -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-staging
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_sme__brutos_gestao_escolar,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
          DB_QUERY_TIMEOUT_SECONDS: '14400'
  - name: rj-sme--brutos-gestao-escolar--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_sme__brutos_gestao_escolar/flow.py:rj_sme__brutos_gestao_escolar
    parameters:
      database:
        type: mssql
        host: clustersqlsme2.rio.rj.gov.br
        port: 1433
        database: GestaoEscolar
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: uv run --no-sync --package rj_sme__brutos_gestao_escolar -- python -m utils.secrets -- prefect flow-run execute
        namespace: pipelines-prod
        secretName: pipelines-infisical
        image_pull_policy: Always
        env:
          INFISICAL_URL: https://infisical.iplan.dados.rio
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_sme__brutos_gestao_escolar,/shared
          GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/credential.json
          DB_QUERY_TIMEOUT_SECONDS: '14400'
    schedules:
      - interval: 86400
        anchor_date: '2026-06-08T06:30:00'
        timezone: America/Sao_Paulo
        slug: turma
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: turma
          read:
            table: dbo.VW_BI_Turma
          dump_mode: append
          options:
            select:
              - Ano
              - Curso
              - Nivel_Ensino
              - Modalidade
              - Grupamento
              - Turma
              - Turno
              - Sala
              - Area_Sala
              - Capac_Sala
              - Tipo_Sala
              - Sala_Util_Como
              - Tot_Turma
              - tur_id
              - esc_id
              - dep_id
            chunks:
              column: Ano
              width: 1
              begin: 2026
              end: 2030
              lookback: 1
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-06-08T06:00:00'
        timezone: America/Sao_Paulo
        slug: CLS_TurmaAulaAluno
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: CLS_TurmaAulaAluno
          read:
            table: dbo.CLS_TurmaAulaAluno
          dump_mode: append
          options:
            chunks:
              column: taa_dataAlteracao
              width: day
              begin: '2026-10-27'
              lookback: 2
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-06-08T06:40:00'
        timezone: America/Sao_Paulo
        slug: diasCoc
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: diasCoc
          read:
            query: |
              select distinct cal.cal_id,
                              tpc_id,
                              dbo.FN_CalcularDiasUteis(cap_dataInicio,cap_dataFim,'8BB1DECA-BB19-E011-87E8-E61F133BFC53',
                              cal.cal_id) diasCoc
              from ACA_CalendarioPeriodo cap WITH(NOLOCK)
              INNER JOIN ACA_CalendarioAnual          CAL WITH(NOLOCK) ON CAL.cal_id = cap.cal_id and cal_situacao <> 3
              inner join MTR_ProcessoFechamentoInicio pfi WITH(NOLOCK) ON pfi.pfi_anoInicio = cal.cal_ano and pfi_situacao <> 3 and pfi_AnoLetivoCorrente = 1
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-06-08T06:50:00'
        timezone: America/Sao_Paulo
        slug: numeroDeAulasCte
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: numeroDeAulasCte
          read:
            query: |
              SELECT
                       MTU.alu_id,
                       MTU.mtu_id,
                       CAP.tpc_id,
                       GestaoEscolar.dbo.FN_CalcularDiasUteis(CAP.cap_dataInicio,GETDATE(),'8BB1DECA-BB19-E011-87E8-E61F133BFC53',CAP.cal_id) * ISNULL(CRP.crp_qtdeTemposDia,1) numeroAulas             FROM MTR_MatriculaTurma MTU WITH(NOLOCK)
                   INNER JOIN TUR_Turma TUR WITH(NOLOCK)
                       ON MTU.tur_id = TUR.tur_id
                       AND TUR.tur_situacao IN (1,5)
                   INNER JOIN ACA_CalendarioAnual CAL WITH(NOLOCK)
                       ON TUR.cal_id = CAL.cal_id
                       AND CAL.cal_ano = YEAR(GETDATE())
                   INNER JOIN TUR_TurmaCurriculo TCR WITH(NOLOCK)
                       ON TUR.tur_id = TCR.tur_id
                       AND TCR.tcr_situacao = 1
                   INNER JOIN ACA_CurriculoPeriodo CRP WITH(NOLOCK)
                       ON TCR.cur_id = CRP.cur_id
                       AND TCR.crr_id = CRP.crr_id
                       AND TCR.crp_id = CRP.crp_id
                       AND CRP.crp_situacao = 1
                   INNER JOIN ACA_CalendarioPeriodo CAP WITH(NOLOCK)
                       ON TUR.cal_id = CAP.cal_id
                       AND GETDATE() BETWEEN CAP.cap_dataInicio AND CAP.cap_dataFim
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-06-08T06:00:00'
        timezone: America/Sao_Paulo
        slug: CLS_AlunoAvaliacaoTurma
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: CLS_AlunoAvaliacaoTurma
          read:
            table: dbo.CLS_AlunoAvaliacaoTurma
          dump_mode: append
          options:
            chunks:
              column: aat_dataAlteracao
              width: month
              begin: '2026-10-01'
              lookback: 1
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-06-08T06:10:00'
        timezone: America/Sao_Paulo
        slug: TUR_TurmaRelTurmaDisciplina
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: TUR_TurmaRelTurmaDisciplina
          read:
            query: |
              SELECT
                tur_id,
                tud_id
              FROM GestaoEscolar.dbo.TUR_TurmaRelTurmaDisciplina
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2026-06-08T06:20:00'
        timezone: America/Sao_Paulo
        slug: VW_BI_Aluno_Todos_Os_Anos
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: VW_BI_Aluno_Todos_Os_Anos
          read:
            query: |
              SELECT
                Ano,
                Matricula,
                Nome,
                Sexo,
                Endereco,
                Bairro,
                CEP,
                Filiacao_1,
                Filiacao_2,
                Mora_com_Filiacao,
                CPF,
                NIS_Aluno,
                NIS_Resp,
                Raça_Cor,
                Cod_def,
                Deficiência,
                Tipo_Transporte,
                Bolsa_Familia,
                CFC,
                Territorios_Sociais,
                Clube_Escolar,
                Nucleo_Artes,
                Mais_Educacao,
                DataNascimento,
                Idade_Atual,
                Idade_3112,
                Grupamento,
                Turma,
                UP_Aval,
                telefone,
                telefone_casa,
                telefone_recado,
                telefone_trab,
                celular_1,
                celular_2,
                Situacao,
                Cod_Ult_Mov,
                Ult_Movimentação,
                Tot_Aluno,
                alu_id,
                tur_id
              FROM GestaoEscolar.dbo.VW_BI_Aluno_Todos_Os_Anos
          dump_mode: overwrite
          options:
            columns:
              add_timestamp: true
      - interval: 86400
        anchor_date: '2022-01-01T21:00:00'
        timezone: America/Sao_Paulo
        slug: VW_BI_Avaliacao
        parameters:
          table:
            dataset_id: brutos_gestao_escolar
            table_id: VW_BI_Avaliacao
          read:
            query: |
              WITH aad0ed8f AS (
                SELECT
                  [Ano],
                  [COC],
                  [tpc_nome],
                  [tur_codigo],
                  [Reunião_Pais],
                  [Frequencia],
                  [Freq_Acumulada],
                  [Conceito],
                  [GLB],
                  [MAT],
                  [POR],
                  [CIE],
                  [GEO],
                  [HIS],
                  [EFI],
                  [ING],
                  [ESP],
                  [FRA],
                  [ALE],
                  [LE],
                  [AVI],
                  [APL],
                  [ACE],
                  [TEA],
                  [MUS],
                  [ART],
                  [cur_id],
                  [crp_id],
                  [tur_id],
                  [alu_id],
                  [mtu_id]
                FROM GestaoEscolar.dbo.VW_BI_Avaliacao
              )
              SELECT * FROM aad0ed8f
              WHERE CONVERT(DATE, CAST(Ano AS VARCHAR)) >= '2026'
                AND CONVERT(DATE, CAST(Ano AS VARCHAR)) <= '2030'
          dump_mode: append
          options:
            columns:
              add_timestamp: true
