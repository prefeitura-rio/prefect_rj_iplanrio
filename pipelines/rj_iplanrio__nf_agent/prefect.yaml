name: rj_iplanrio__nf_agent
prefect-version: 3.4.3

# Secrets: the k3s `secretName` below is mounted as env vars into the job pod.
# LLM calls go through the Bifrost gateway, so the secret must provide
# `BIFROST_API_KEY` (Bifrost virtual key). Optionally `BIFROST_BASE_URL` to
# override the default in constants.py. GCP creds for GCS/BigQuery keep coming
# from `RJ_NF_AGENT_CREDENTIALS` (see flow.py).

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false

  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_iplanrio__nf_agent-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_iplanrio__nf_agent/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

# ── Deployments ────────────────────────────────────────────────────────────
deployments:
  - name: rj-iplanrio--nf-agent--staging
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_iplanrio__nf_agent/flow.py:rj_iplanrio__nf_agent
    work_pool:
      name: k3s-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_iplanrio__nf_agent -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always
    parameters:
      bq_input_table: "rj-nf-agent.brutos_cgm_poc_osinfo_ia_pipeline.vw_despesas_recorte_teste"
      bq_status_table: "rj-nf-agent.brutos_cgm_poc_osinfo_ia_pipeline.controle_processamento"
      pipeline_runs_table: "rj-nf-agent.brutos_cgm_poc_osinfo_ia_pipeline.pipeline_runs"
      batch_size: 500
      gcs_output_base_path: "staging/brutos_cgm_poc_osinfo_ia_pipeline/extracao_pagina"
      db_path: "/tmp/nf_pipeline_cache.db"
      gcs_bucket: "rj-nf-agent"
      workers: 200
      mode: "full"
      requests_per_minute: 600
      max_concurrent: 50
      max_retries: 3
      max_pdfs: null

  - name: rj-iplanrio--nf-agent--prod
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_iplanrio__nf_agent/flow.py:rj_iplanrio__nf_agent
    work_pool:
      name: k3s-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_iplanrio__nf_agent -- prefect flow-run execute
        secretName: prefect-jobs-secrets
        image_pull_policy: Always
    parameters:
      bq_input_table: "rj-nf-agent.brutos_cgm_poc_osinfo_ia_pipeline.vw_desepesas_recorte"
      bq_status_table: "rj-nf-agent.brutos_cgm_poc_osinfo_ia_pipeline.controle_processamento"
      pipeline_runs_table: "rj-nf-agent.brutos_cgm_poc_osinfo_ia_pipeline.pipeline_runs"
      batch_size: 500
      gcs_output_base_path: "staging/brutos_cgm_poc_osinfo_ia_pipeline/extracao_pagina"
      db_path: "/tmp/nf_pipeline_cache.db"
      gcs_bucket: "rj-nf-agent"
      workers: 200
      mode: "full"
      requests_per_minute: 600
      max_concurrent: 50
      max_retries: 3
      max_pdfs: null
