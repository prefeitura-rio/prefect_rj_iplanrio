[project]
name = "rj_iplanrio__nf_agent"
version = "1.0.0"
description = "Classifies pages of expense-report PDFs and extracts fiscal-note (NF) fields in batch through the Bifrost gateway, writing per-page results to GCS for CGM's expense auditing."
dependencies = [
    "prefect>=3.4.9",
    "prefect-docker>=0.6.5",
    "prefect_rj_iplanrio",
    "PyMuPDF>=1.23.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-storage>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["../.."]
