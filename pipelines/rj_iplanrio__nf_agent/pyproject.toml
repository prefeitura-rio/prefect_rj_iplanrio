[project]
name = "rj_iplanrio__nf_agent"
version = "1.0.0"
description = "Extracts and classifies fields from Rio de Janeiro fiscal-note (NF) PDFs with an LLM (via the Bifrost gateway) and loads the structured results into BigQuery and GCS for the CGM expense-auditing workflow."
dependencies = [
    "prefect>=3.4.9",
    "prefect-docker>=0.6.5",
    "prefect_rj_iplanrio",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
    "pdf2image>=1.16.0",
    "pypdf",
    "google-auth>=2.0.0",
    "google-cloud-bigquery>=3.0.0",
    "db-dtypes>=1.0.0",
    "google-cloud-storage>=2.0.0",
    "google-cloud-vision>=3.4.0",
    "pandas>=2.0.0",
    "openpyxl",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "iplanrio-agent-toolkit",
    # Lógica de negócio migrada de agent-nf-validator para utils/ (move mecânico).
    # google-generativeai fica de fora e é instalado isolado no Dockerfile: há um
    # conflito de protobuf entre google-generativeai e grpcio-status. Pelo mesmo
    # motivo o extra "gemini" do iplanrio-agent-toolkit NÃO é requisitado aqui —
    # apenas os módulos base (rate limiter, gcs, bigquery, matching, credentials).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
"iplanrio-agent-toolkit" = { git = "ssh://git@ssh.github.com:443/prefeitura-rio/iplanrio-agent-toolkit.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Repo root (two levels up from this pyproject.toml) so `pipelines.rj_iplanrio__nf_agent.*`
# imports resolve the same way they do for the rest of the codebase/CI, without needing
# `__init__.py` files or a src-layout change just for tests.
pythonpath = ["../.."]
