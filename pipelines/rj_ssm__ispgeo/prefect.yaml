name: rj_ssm__ispgeo
prefect-version: 3.4.3

build:
- prefect.deployments.steps.run_shell_script:
    id: get-commit-hash
    script: git rev-parse --short HEAD
    stream_output: false
- prefect_docker.deployments.steps.build_docker_image:
    id: build-image
    requires: prefect-docker>=0.6.5
    image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
    tag: "rj_ssm__ispgeo-{{ get-commit-hash.stdout }}"
    dockerfile: pipelines/rj_ssm__ispgeo/Dockerfile

push:
- prefect_docker.deployments.steps.push_docker_image:
    requires: prefect-docker>=0.6.5
    image_name: "{{ build-image.image_name }}"
    tag: "{{ build-image.tag }}"

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /opt/prefect/prefect_rj_iplanrio

deployments:
- name: rj-ssm--ispgeo--staging
  tags:
  - environment:staging
  - severity:high
  - code_owner:tricktx
  version: "{{ build-image.tag }}"
  entrypoint: pipelines/rj_ssm__ispgeo/flow.py:rj_ssm__ispgeo
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_ssm__ispgeo -- prefect flow-run execute
      secretName: prefect-jobs-secrets-staging
      image_pull_policy: Always
- name: rj-ssm--ispgeo--prod
  tags:
  - environment:prod
  - severity:high
  - code_owner:tricktx
  version: "{{ get-commit-hash.stdout }}"
  entrypoint: pipelines/rj_ssm__ispgeo/flow.py:rj_ssm__ispgeo
  work_pool:
    name: onprem-pool
    work_queue_name: default
    job_variables:
      image: "{{ build-image.image_name }}:{{ build-image.tag }}"
      command: uv run --package rj_ssm__ispgeo -- prefect flow-run execute
      secretName: prefect-jobs-secrets
      image_pull_policy: Always

  schedules:
  # Roda diariamente às 10h.
  # Janela: do dia 1 do mês de 6 meses atrás até hoje, sobre a data de registro (datc), calculada pelo flow.
  - cron: "0 10 * * *"
    timezone: America/Sao_Paulo
    slug: ocorrencias
    parameters:
      table_id: ocorrencias
      dump_mode: append
