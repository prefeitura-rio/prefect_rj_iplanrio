name: rj_crm__agent_quality_registry
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: rj_crm__agent_quality_registry-{{ get-commit-hash.stdout }}
      dockerfile: pipelines/rj_crm__agent_quality_registry/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: '{{ build-image.image_name }}'
      tag: '{{ build-image.tag }}'

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-crm--agent-quality-registry--staging
    tags:
      - environment:staging
      - severity:high
      - code_owner:voymesquita
    version: '{{ build-image.tag }}'
    entrypoint: pipelines/rj_crm__agent_quality_registry/flow.py:rj_crm__agent_quality_registry
    parameters:
      environment: staging
    work_pool:
      name: k3s-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: "uv run --package rj_crm__agent_quality_registry -- prefect flow-run execute"
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always

  - name: rj-crm--agent-quality-registry--prod
    tags:
      - environment:prod
      - severity:high
      - code_owner:voymesquita
    version: '{{ get-commit-hash.stdout }}'
    entrypoint: pipelines/rj_crm__agent_quality_registry/flow.py:rj_crm__agent_quality_registry
    parameters:
      environment: prod
    work_pool:
      name: k3s-pool
      work_queue_name: default
      job_variables:
        image: '{{ build-image.image_name }}:{{ build-image.tag }}'
        command: "uv run --package rj_crm__agent_quality_registry -- prefect flow-run execute"
        secretName: prefect-jobs-secrets
        image_pull_policy: Always
    schedules:
      - cron: "30 6 * * *"
        timezone: America/Sao_Paulo
        active: true
        slug: agent-quality-registry-daily
