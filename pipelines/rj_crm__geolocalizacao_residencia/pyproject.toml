[project]
name = "rj_crm__geolocalizacao_residencia"
version = "0.1.0"
description = "Pipeline CRM para geolocalização de endereços residenciais com múltiplas estratégias"
dependencies = [
    "prefect_rj_iplanrio",
    "pandas",
    "numpy",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "geopy",
    "openlocationcode",
    "unidecode",
    "aiohttp",
    "requests",
    "pendulum",
    "pytz",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
