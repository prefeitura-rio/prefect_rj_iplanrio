[project]
name = "rj_crm__geolocalizacao_residencia"
version = "0.1.0"
description = "Pipeline CRM para geolocalização de endereços residenciais com múltiplas estratégias"
dependencies = [
    "prefect_rj_iplanrio",
    # Core Prefect

    # Data processing
    "pandas",
    "numpy",

    # Google Cloud dependencies
    "google-cloud-bigquery",
    "google-cloud-storage",
    "basedosdados",

    # Geocoding libraries
    "geopy",
    "openlocationcode",
    "unidecode",

    # HTTP and async
    "aiohttp",
    "requests",

    # Time and data utilities
    "pendulum",
    "pytz",

    # toolkit utilities
    "prefeitura-rio[actions]",

    # Configuration and environment
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
[tool.uv.sources]
prefect_rj_iplanrio = { workspace = true }
