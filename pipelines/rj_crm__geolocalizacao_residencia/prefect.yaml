name: rj_crm__geolocalizacao_residencia
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_crm__geolocalizacao_residencia-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_crm__geolocalizacao_residencia/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-crm--geolocalizacao-residencia--nominatim--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_crm__geolocalizacao_residencia/flow.py:rj_crm__geolocalizacao_residencia
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --no-sync --package rj_crm__geolocalizacao_residencia -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        finished_job_ttl: 600
        pod_annotations:
          gke-gcsfuse/volumes: 'true'
        resources:
          requests:
            ephemeral-storage: 1Gi
          limits:
            ephemeral-storage: 4Gi
        volume_mounts:
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: tmp
            csi:
              driver: gcsfuse.csi.storage.gke.io
              volumeAttributes:
                bucketName: rj-iplanrio-dia-pipelines-tmp-gke
                mountOptions: implicit-dirs,file-mode=666,dir-mode=777,enable-buffered-read
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_crm__geolocalizacao_residencia,/shared
          GCS_TMP_BUCKET: rj-iplanrio-dia-pipelines-tmp-gke
    parameters:
      strategy: nominatim
      table:
        dataset_id: brutos_dados_enriquecidos
        table_id: enderecos_geolocalizados
      dump_mode: append
      max_concurrent: 100
  - name: rj-crm--geolocalizacao-residencia--nominatim--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: "{{ get-commit-hash.stdout }}"
