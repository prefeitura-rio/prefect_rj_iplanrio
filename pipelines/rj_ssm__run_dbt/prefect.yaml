name: rj_ssm__run_dbt
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_ssm__run_dbt-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_ssm__run_dbt/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-ssm--run_dbt--staging
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_ssm__run_dbt/flow.py:rj_ssm__run_dbt
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_ssm__run_dbt -- prefect flow-run execute
        secretName: prefect-jobs-ssm-secrets
        image_pull_policy: Always
    # schedules:
      # # Quarterly hour (900 seconds = 15 minutes) As execuções a cada 15 min passam a reescrever apenas os dois últimos dias e sem rodar os testes (passe quente)
      # # Schedule 5: run each 15 minutes updating only last 2 days
      # - interval: 900
      #   anchor_date: "2024-03-17T09:15:00"
      #   timezone: America/Sao_Paulo
      #   slug: dbt_quarter_hourly_build
      #   parameters:
      #     command: "build"
      #     select: >-
      #       tag:quarter_hourly --vars '{passe: quente}'
      #     send_discord_report: false
      #     github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
      #     bigquery_project: "rj-ssm"
      #     target: "prod"
      #     gcs_buckets:
      #       prod: "rj-ssm"
      #       dev: "rj-ssm-dev"
  - name: rj-ssm--run_dbt--prod
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_ssm__run_dbt/flow.py:rj_ssm__run_dbt
    # Evita que duas schedules rodem em paralelo sobre os mesmos modelos.
    # Ex.: dbt_12h_build e dbt_quarter_hourly_build compartilham o select
    # "tag:quarter_hourly" e, quando coincidem, geram testes unique flaky.
    # (ex.: raw_superapp_mobile_originated_v2__id_mensagem__unique) por
    # concorrência de escrita no mesmo modelo incremental.
    concurrency_limit:
      limit: 1
      collision_strategy: ENQUEUE
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_ssm__run_dbt -- prefect flow-run execute
        secretName: prefect-jobs-ssm-secrets
        image_pull_policy: Always
    schedules:
      # Daily schedules (86400 seconds = 24 hours)
      # Schedule 1: Daily source freshness check
      - interval: 86400
        anchor_date: "2023-01-01T09:00:00"
        timezone: America/Sao_Paulo
        slug: dbt_daily_freshness
        parameters:
          command: "source freshness"
          send_discord_report: true
          github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
          bigquery_project: "rj-ssm"
          target: "prod"
          gcs_buckets:
            prod: "rj-ssm"
            dev: "rj-ssm-dev"

      # Schedule 2: Daily build with daily and freshness tags
      - interval: 86400
        anchor_date: "2023-01-01T10:15:00"
        timezone: America/Sao_Paulo
        slug: dbt_daily_build
        parameters:
          command: "build"
          select: "+tag:daily"
          send_discord_report: true
          github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
          bigquery_project: "rj-ssm"
          target: "prod"
          gcs_buckets:
            prod: "rj-ssm"
            dev: "rj-ssm-dev"

      # Schedule 6: run 4x a day (09h, 12h, 15h, 18h) with fatores tag
      - cron: "0 9,12,15,18 * * *"
        timezone: America/Sao_Paulo
        slug: dbt_fatores_build
        parameters:
          command: "build"
          select: "tag:fatores"
          send_discord_report: true
          github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
          bigquery_project: "rj-ssm"
          target: "prod"
          gcs_buckets:
            prod: "rj-ssm"
            dev: "rj-ssm-dev"

      # Weekly schedules (604800 seconds = 7 days)
      # Schedule 3: Weekly build with weekly tags
      # - interval: 604800
      #   anchor_date: "2024-03-17T09:15:00"
      #   timezone: America/Sao_Paulo
      #   slug: dbt_weekly_build
      #   parameters:
      #     command: "build"
      #     select: "+tag:weekly"
      #     send_discord_report: true
      #     github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
      #     bigquery_project: "rj-ssm"
      #     target: "prod"
      #     gcs_buckets:
      #       prod: "rj-ssm"
      #       dev: "rj-ssm-dev"

      # Quarterly hour update last 7 days
      # Schedule 4: run each 12 h
      # - interval: 43200
      #   anchor_date: "2024-03-17T09:15:00"
      #   timezone: America/Sao_Paulo
      #   slug: dbt_12h_build
      #   parameters:
      #     command: "build"
      #     select: "tag:quarter_hourly"
      #     send_discord_report: true
      #     github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
      #     bigquery_project: "rj-ssm"
      #     target: "prod"
      #     gcs_buckets:
      #       prod: "rj-ssm"
      #       dev: "rj-ssm-dev"
      
      # Quarterly hour (900 seconds = 15 minutes) As execuções a cada 15 min passam a reescrever apenas os dois últimos dias e sem rodar os testes (passe quente)
      # Schedule 5: run each 15 minutes updating only last 2 days
      # - interval: 900
      #   anchor_date: "2024-03-17T09:15:00"
      #   timezone: America/Sao_Paulo
      #   slug: dbt_quarter_hourly_build
      #   parameters:
      #     command: "build"
      #     select: >-
      #       tag:quarter_hourly --vars '{passe: quente}'
      #     send_discord_report: true
      #     github_repo: "https://GITHUB_TOKEN@github.com/prefeitura-rio/queries-rj-ssm.git"
