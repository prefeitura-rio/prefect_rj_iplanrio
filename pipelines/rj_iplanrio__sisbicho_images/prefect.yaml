name: rj_iplanrio__sisbicho_images
prefect-version: 3.4.9

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_iplanrio__sisbicho_images-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_iplanrio__sisbicho_images/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj_iplanrio__sisbicho_imagem--staging
    tags:
      - environment:staging
      - severity:medium
      - code_owner:unassigned
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_iplanrio__sisbicho_images/flow.py:rj_iplanrio__sisbicho_images
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_iplanrio__sisbicho_images -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: staging
          INFISICAL_PATHS: /rj_iplanrio__sisbicho_images,/gke
    parameters:
      source:
        dataset_id: brutos_sisbicho
        table_id: animal
      table:
        dataset_id: brutos_sisbicho
        table_id: animal_imagem
      storage:
        bucket: portal-do-cidadao
        prefix: animal/fotos_staging
  - name: rj_iplanrio__sisbicho_imagem--prod
    tags:
      - environment:prod
      - severity:medium
      - code_owner:unassigned
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_iplanrio__sisbicho_images/flow.py:rj_iplanrio__sisbicho_images
    work_pool:
      name: default-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_iplanrio__sisbicho_images -- python -m utils.secrets -- prefect flow-run execute
        image_pull_policy: Always
        service_account_name: pipelines
        env:
          INFISICAL_URL: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
          INFISICAL_IDENTITY_ID: ae19371c-5d95-47e2-a00b-b92a394becb8
          INFISICAL_PROJECT_ID: 17f5c1ee-4ee5-446e-9ce4-9910b2657fd0
          INFISICAL_ENVIRONMENT: prod
          INFISICAL_PATHS: /rj_iplanrio__sisbicho_images,/gke
    parameters:
      source:
        dataset_id: brutos_sisbicho
        table_id: animal
      table:
        dataset_id: brutos_sisbicho
        table_id: animal_imagem
      storage:
        bucket: portal-do-cidadao
        prefix: animal/fotos
    schedule:
      cron: "0 6 * * *"
      timezone: America/Sao_Paulo
