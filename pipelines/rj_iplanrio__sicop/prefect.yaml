name: rj_iplanrio__sicop
prefect-version: 3.4.3

build:
  - prefect.deployments.steps.run_shell_script:
      id: get-commit-hash
      script: git rev-parse --short HEAD
      stream_output: false
  - prefect_docker.deployments.steps.build_docker_image:
      id: build-image
      requires: prefect-docker>=0.6.5
      image_name: ghcr.io/prefeitura-rio/prefect_rj_iplanrio/deployments
      tag: "rj_iplanrio__sicop-{{ get-commit-hash.stdout }}"
      dockerfile: pipelines/rj_iplanrio__sicop/Dockerfile

push:
  - prefect_docker.deployments.steps.push_docker_image:
      requires: prefect-docker>=0.6.5
      image_name: "{{ build-image.image_name }}"
      tag: "{{ build-image.tag }}"

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /opt/prefect/prefect_rj_iplanrio

deployments:
  - name: rj-iplanrio--sicop--staging
    version: "{{ build-image.tag }}"
    entrypoint: pipelines/rj_iplanrio__sicop/flow.py:rj_iplanrio__sicop
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_iplanrio__sicop -- prefect flow-run execute
        secretName: prefect-jobs-secrets-staging
        image_pull_policy: Always

  - name: rj-iplanrio--sicop--prod
    version: "{{ get-commit-hash.stdout }}"
    entrypoint: pipelines/rj_iplanrio__sicop/flow.py:rj_iplanrio__sicop
    work_pool:
      name: onprem-pool
      work_queue_name: default
      job_variables:
        image: "{{ build-image.image_name }}:{{ build-image.tag }}"
        command: uv run --package rj_iplanrio__sicop -- prefect flow-run execute
        secretName: prefect-jobs-secrets
        image_pull_policy: Always
    schedules:

      - interval: 86400
        anchor_date: '2025-07-15T07:12:00'
        timezone: America/Sao_Paulo
        slug: parte_envolvida
        parameters:
          table_id: parte_envolvida
          dump_mode: overwrite
          execute_query: |
            SELECT
              NUM_PROCESSO AS ID_PROCESSO,
              NUM_SEQUENCIAL_PARTE AS ID_SEQUENCIAL_PARTE,
              NOME_PARTE_ENVOLVIDA AS NOME_PARTE_ENVOLVIDA,
              ENDERECO_PARTE_ENVOLVIDA AS ENDERECO_PARTE_ENVOLVIDA,
              NUMERO_PORTA_PARTE_ENVOLVIDA AS NUMERO_PORTA_PARTE_ENVOLVIDA,
              COMPLEMENTO_PARTE_ENVOLVIDA AS COMPLEMENTO_PARTE_ENVOLVIDA,
              BAIRRO_PARTE_ENVOLVIDA AS BAIRRO_PARTE_ENVOLVIDA,
              CEP_PARTE_ENVOLVIDA AS CEP_PARTE_ENVOLVIDA,
              TELEFONE AS TELEFONE,
              QUALIFICACAO_DA_PARTE AS QUALIFICACAO,
              DATA_PROCURACAO AS DATA_PROCURACAO,
              TIPO_DOCUMENTO_PARTE_ENVOLVIDA AS TIPO_DOCUMENTO_PARTE_ENVOLVIDA,
              DOCUMENTO_PARTE_ENVOLVIDA AS DOCUMENTO_PARTE_ENVOLVIDA,
              MAT_RESPONSAVEL AS MATRICULA_RESPONSAVEL
            FROM SICOP.VW_PARTE_ENVOLVIDA_DLK

      - interval: 86400
        anchor_date: '2025-07-15T07:01:00'
        timezone: America/Sao_Paulo
        slug: veiculo
        parameters:
          table_id: veiculo
          dump_mode: overwrite
          execute_query: |
            SELECT NUM_PROCESSO AS ID_PROCESSO, NUM_PLACA AS ID_PLACA FROM SICOP.VW_VEICULO_DLK

      - interval: 86400
        anchor_date: '2025-07-15T00:01:00'
        timezone: America/Sao_Paulo
        slug: tramitacao_processo
        parameters:
          table_id: tramitacao_processo
          dump_mode: overwrite
          execute_query: |
            SELECT
            NUM_PROCESSO,
            SEQ,
            NUM_GUIA,
            MAT_DESPACHO,
            mat_dig_tramitacao,
            dt_dig_tramitacao,
            mat_dig_recebimento,
            dt_dig_recebimento,
            COD_DESPACHO,
            DATA_DESPACHO,
            DATA_SAIDA,
            ORG_ORIGEM,
            ORG_DESTINO,
            ORG_TRANSCRITOR
            FROM SICOP.VW_TRAMITACAO_PROCESSO_DLK

      - interval: 86400
        anchor_date: '2025-07-20T05:10:00'
        timezone: America/Sao_Paulo
        slug: localiza_processo
        parameters:
          table_id: localiza_processo
          dump_mode: overwrite
          execute_query: |
            SELECT NUM_PROCESSO, LOCALIZA_PROCESSO FROM SICOP.VW_LOCALIZA_PROCESSO_DLK


      - interval: 86400
        anchor_date: '2025-07-20T05:20:00'
        timezone: America/Sao_Paulo
        slug: orgao
        parameters:
          table_id: orgao
          dump_mode: overwrite
          execute_query: |
            SELECT ORG_SICOP, SIGLA_ORGAO, DESC_ORGAO, END_ORGAO,TEL_ORGAO  FROM SICOP.VW_ORGAO_DLK

      - interval: 86400
        anchor_date: '2025-07-20T05:30:00'
        timezone: America/Sao_Paulo
        slug: assunto
        parameters:
          table_id: assunto
          dump_mode: overwrite
          execute_query: |
            SELECT
            DATA_SISTEMA,
            IDENT,
            COD,
            SEQ,
            CHAVE_IDENT_COD_SEQ,
            DESC_ASSUNTO
            FROM SICOP.VW_ASSUNTO_DLK

      - interval: 86400
        anchor_date: '2025-07-20T05:40:00'
        timezone: America/Sao_Paulo
        slug: documento
        parameters:
          table_id: documento
          dump_mode: overwrite
          execute_query: |
            SELECT TIPO_DOC,NUM_DOCUMENTO,ORG_RESP,DATA_DOCUMENTO,PRAZO_DOC,PROC_JUD_DOC,NUMERO_EXTERNO,
            NUM_PROCESSO,REQUERENTE,COD_ASSUN,ASSUN_COMP,TP_DOC_INF,NUM_DOCUMENTO_INF,ORG_RESP_INF FROM SICOP.VW_DOCUMENTO_DLK

      - interval: 86400
        anchor_date: '2025-07-20T06:50:00'
        timezone: America/Sao_Paulo
        slug: ultima_tram_processo
        parameters:
          table_id: ultima_tram_processo
          dump_mode: overwrite
          execute_query: |
            SELECT I22004_COD_NPROC2,I22004_RA_NPROC2,I22004_SEQ_NPROC2,I22004_SEC_NPROC2,I22004_ANO_NPROC2,MAX_SEQ,I22004_ORG_ORIGEM,I22004_ORG_DEST,I22004_COD_DESP,
              I22004_MAT_TRANSC,I22004_NUM_GUIA  FROM SICOP.VW_ULTIMA_TRAM_PROCESSO_DLK


      - interval: 86400
        anchor_date: '2025-07-20T06:00:00'
        timezone: America/Sao_Paulo
        slug: despacho
        parameters:
          table_id: despacho
          dump_mode: overwrite
          execute_query: |
            SELECT IDENT,SEQ_REM,SEQ,DESCRICAO FROM SICOP.VW_DESPACHO_DLK

      - interval: 86400
        anchor_date: '2025-07-20T07:30:00'
        timezone: America/Sao_Paulo
        slug: processo2
        parameters:
          table_id: processo2
          dump_mode: overwrite
          execute_query: |
            select
            num_processo,
            num_processo_principal,
            data_processo,
            data_sistema,
            hora_processo,
            matricula_digitador,
            orgao_documento,
            tipo_documento,
            documento,
            codigo_assunto,
            descricao_assunto,
            situacao_processo,
            sta_dig_registro,
            qtd_volumes,
            org_origem,
            org_transcritor,
            org_alteracao,
            org_destino,
            codigo_logradouro,
            requerente,
            num_volume
            from SICOP.VW_PROCESSO2_DLK
