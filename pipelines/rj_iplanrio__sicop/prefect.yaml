      - interval: 86400
        anchor_date: '2025-07-20T07:30:00'
        timezone: America/Sao_Paulo
        slug: processo2
        parameters:
          table:
            dataset_id: brutos_sicop
            table_id: processo2
          read:
            query: |
              select
              num_processo,
              num_processo_principal,
              data_processo,
              data_sistema,
              hora_processo,
              matricula_digitador,
              orgao_documento,
              tipo_documento,
              documento,
